<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>macOS - Oblivian</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root {
    --system-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --accent: #6ee7ff;
    --accent-strong: #3b82f6;
    --accent-2: #8b5cf6;
    --bg-main: #050816;
    --glass: rgba(17, 24, 39, 0.58);
    --glass-strong: rgba(15, 23, 42, 0.78);
    --glass-light: rgba(255,255,255,0.18);
    --line: rgba(255,255,255,0.18);
    --text: #e6f3ff;
    --muted: #b4c4d9;
    --dark: #020611;
  }

  * { box-sizing: border-box; user-select: none; -webkit-user-drag: none; }
  html, body { height: 100%; margin: 0; overflow: hidden; font-family: var(--system-font); background: var(--bg-main); color: var(--text); }

  body {
    background:
      radial-gradient(circle at 20% 20%, rgba(59,130,246,0.5), transparent 25%),
      radial-gradient(circle at 80% 30%, rgba(139,92,246,0.3), transparent 28%),
      linear-gradient(135deg, #050816 0%, #0b1120 35%, #0f172a 100%);
  }

  #wallpaper {
    position: fixed; inset: 0; z-index: 0;
    background:
      linear-gradient(180deg, rgba(15,23,42,0.12), rgba(2,6,17,0.42)),
      url('https://images.unsplash.com/photo-1448375240586-882707db888b?q=80&w=2070&auto=format&fit=crop') center/cover no-repeat;
    transition: background 0.5s ease;
    filter: saturate(1.10) contrast(1.05);
  }

  #menubar {
    position: fixed; top: 0; left: 0; right: 0; height: 32px; z-index: 9999;
    background: rgba(255,255,255,0.12); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    display: flex; align-items: center; justify-content: space-between; padding: 0 18px;
    color: #f4f8ff; font-size: 12px; font-weight: 600; box-shadow: 0 8px 24px rgba(0,0,0,0.16);
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .menu-left, .menu-right { display: flex; gap: 18px; align-items: center; }
  .menu-item { cursor: pointer; opacity: 0.92; transition: opacity 0.2s, transform 0.2s; }
  .menu-item:hover { opacity: 1; transform: translateY(-1px); }
  .apple-logo { font-size: 16px; margin-right: 4px; cursor: default; }
  .menu-right svg { width: 16px; height: 16px; fill: currentColor; cursor: pointer; opacity: 0.8; }

  #quick-actions {
    position: absolute; top: 48px; left: 32px; z-index: 20; display: flex; gap: 10px; flex-wrap: wrap;
  }
  .quick-btn {
    appearance: none; border: 1px solid rgba(255,255,255,0.15); border-radius: 999px;
    padding: 8px 14px; background: rgba(255,255,255,0.08); color: var(--text); font-weight: 600; cursor: pointer;
    box-shadow: 0 10px 22px rgba(15, 23, 42, 0.25); transition: transform 0.2s ease, background 0.2s ease;
  }
  .quick-btn:hover { transform: translateY(-2px); background: rgba(255,255,255,0.14); }
  .quick-btn.primary {
    background: linear-gradient(135deg, rgba(110,231,255,0.9), rgba(59,130,246,0.9));
    color: #03131d; border-color: transparent;
  }

  #widgets {
    position: absolute; top: 94px; left: 30px; z-index: 10; display: flex; flex-direction: column; gap: 14px; pointer-events: none;
  }
  .widget {
    background: rgba(10,17,31,0.42); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
    border-radius: 22px; border: 1px solid rgba(255,255,255,0.12); padding: 16px; color: #fff;
    box-shadow: 0 20px 30px rgba(0,0,0,0.18); width: 176px; pointer-events: auto;
  }
  .w-weather { background: linear-gradient(180deg, rgba(37,99,235,0.84), rgba(59,130,246,0.6)); border: none; }
  .w-weather h2 { margin: 0; font-size: 34px; font-weight: 400; }
  .w-weather p { margin: 4px 0; font-size: 14px; font-weight: 500; }
  .w-weather .desc { font-size: 12px; opacity: 0.9; line-height: 1.4; }
  .w-battery { text-align: center; }
  .w-battery .ring { width: 60px; height: 60px; border-radius: 50%; border: 6px solid rgba(255,255,255,0.2); border-top-color: #f87171; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font-weight: 700; }
  .w-calendar { height: 160px; }
  .w-calendar .header { color: #fca5a5; font-size: 12px; font-weight: 700; text-transform: uppercase; }
  .w-calendar .date { font-size: 40px; font-weight: 300; line-height: 1; margin-top: 5px; color: #e5f1ff; }
  .w-calendar .event { font-size: 11px; color: #e5f1ff; margin-top: 10px; line-height: 1.3; }

  #clock {
    position: absolute; top: 35%; left: 50%; transform: translate(-50%, -50%);
    font-size: 130px; font-weight: 500; color: #fff; letter-spacing: -4px;
    text-shadow: 0 6px 24px rgba(0,0,0,0.35); z-index: 5; pointer-events: none; white-space: nowrap; transition: font-size 0.3s;
  }

  #desktop-icons {
    position: absolute; top: 50px; right: 20px; z-index: 10; display: flex; flex-direction: column; gap: 20px; align-items: center; pointer-events: none;
  }
  .d-icon { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; pointer-events: auto; }
  .d-icon .img {
    width: 62px; height: 62px; background: linear-gradient(180deg, rgba(255,255,255,0.92), rgba(255,255,255,0.6));
    border-radius: 16px; box-shadow: 0 12px 25px rgba(0,0,0,0.25); display: flex; align-items: center; justify-content: center; font-size: 30px;
    border: 1px solid rgba(255,255,255,0.2);
  }
  .d-icon span { color: #fff; font-size: 12px; text-shadow: 0 1px 3px rgba(0,0,0,0.8); text-align: center; font-weight: 600; }

  #dock-container { position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); z-index: 9999; max-width: 100vw; }
  #dock {
    display: flex; gap: 7px; padding: 10px 14px; border-radius: 28px; background: rgba(17,24,39,0.42);
    backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); border: 1px solid rgba(255,255,255,0.12);
    box-shadow: 0 20px 28px rgba(2,6,17,0.4); align-items: flex-end; overflow-x: auto; overflow-y: hidden; scrollbar-width: none;
  }
  #dock::-webkit-scrollbar { display: none; }
  .dock-item {
    width: 58px; height: 58px; min-width: 58px; border-radius: 16px; display: flex; align-items: center; justify-content: center;
    font-size: 34px; cursor: pointer; transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.2s ease;
    position: relative; background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03));
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.18);
  }
  .dock-item:hover { transform: scale(1.28) translateY(-10px); margin: 0 6px; box-shadow: 0 16px 25px rgba(59,130,246,0.2); }
  .dock-item:hover .tooltip { opacity: 1; }
  .tooltip {
    position: absolute; top: -34px; left: 50%; transform: translateX(-50%);
    background: rgba(2,6,17,0.78); color: #fff; font-size: 12px; padding: 4px 10px; border-radius: 8px;
    opacity: 0; pointer-events: none; transition: opacity 0.2s; white-space: nowrap; border: 1px solid rgba(255,255,255,0.15);
  }
  .dock-divider { width: 1px; height: 52px; background: rgba(255,255,255,0.15); margin: 0 5px; align-self: center; min-width: 1px; }
  .dot-indicator { position: absolute; bottom: 4px; width: 5px; height: 5px; border-radius: 50%; background: #e0f2fe; opacity: 0; transition: opacity 0.2s; }
  .dock-item.active .dot-indicator { opacity: 1; }

  #desk-windows { position: fixed; inset: 0; z-index: 1000; pointer-events: none; }
  .win {
    position: absolute; pointer-events: auto; display: flex; flex-direction: column; min-width: 350px; min-height: 250px;
    background: linear-gradient(180deg, rgba(255,255,255,0.96), rgba(239,244,249,0.96));
    border-radius: 16px; overflow: hidden; border: 1px solid rgba(19, 25, 39, 0.08);
    box-shadow: 0 28px 70px rgba(2, 6, 17, 0.35), 0 0 0 1px rgba(0,0,0,0.08);
    animation: pop 0.2s cubic-bezier(0.2, 0.8, 0.2, 1); resize: both;
  }
  @keyframes pop { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
  .win-header {
    height: 38px; background: rgba(246,248,250,0.9); border-bottom: 1px solid rgba(17,24,39,0.08);
    display: flex; align-items: center; padding: 0 12px; cursor: grab; flex-shrink: 0;
  }
  .win-header:active { cursor: grabbing; }
  .traffic-lights { display: flex; gap: 8px; }
  .tl { width: 12px; height: 12px; border-radius: 50%; border: 0.5px solid rgba(0,0,0,0.08); cursor: pointer; }
  .tl.close { background: #ff5f56; }
  .tl.min { background: #ffbd2e; }
  .tl.max { background: #27c93f; }
  .tl.close:hover, .tl.min:hover, .tl.max:hover { filter: brightness(0.85); }
  .win-title { flex: 1; text-align: center; font-size: 13px; font-weight: 700; color: #1f2a39; margin-right: 50px; }
  .win-body { flex: 1; overflow: auto; background: #fff; color: #1c2431; font-size: 13px; display: flex; flex-direction: column; }

  .app-pad { padding: 20px; }
  .app-btn {
    background: linear-gradient(135deg, var(--accent-strong), #60a5fa);
    color: #03131d; border: none; padding: 9px 16px; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; transition: transform 0.2s ease, filter 0.2s ease, box-shadow 0.2s ease;
    box-shadow: 0 10px 20px rgba(59,130,246,0.2);
  }
  .app-btn:hover { transform: translateY(-1px); filter: brightness(1.04); }
  .app-btn.sec { background: linear-gradient(135deg, rgba(255,255,255,0.9), rgba(226,232,240,0.9)); color: #111827; }
  .app-btn.ghost { background: rgba(17,24,39,0.08); color: #111827; box-shadow: none; }
  .app-input {
    width: 100%; padding: 10px 12px; border: 1px solid rgba(148,163,184,0.6); border-radius: 10px; font-size: 13px; margin-bottom: 10px; outline: none; font-family: inherit; background: rgba(248,250,252,0.85);
    color: #0f172a;
  }
  .app-input:focus { border-color: rgba(96,165,250,1); box-shadow: 0 0 0 3px rgba(59,130,246,0.18); }

  .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 15px; padding: 18px 20px 10px; }
  .game-tile {
    display: flex; flex-direction: column; align-items: center; text-align: center; cursor: pointer; padding: 10px; border-radius: 14px;
    transition: background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease; background: rgba(241,245,249,0.7); border: 1px solid rgba(148,163,184,0.15);
  }
  .game-tile:hover { background: linear-gradient(180deg, rgba(191,219,254,0.2), rgba(96,165,250,0.08)); transform: translateY(-2px); box-shadow: 0 10px 18px rgba(59,130,246,0.10); }
  .game-tile .ico { font-size: 40px; margin-bottom: 8px; }
  .game-tile .nm { font-size: 12px; font-weight: 600; color: #1f2937; line-height: 1.2; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-word; }

  .mac-chat { display: flex; height: 100%; flex: 1; }
  .mac-chat .side { width: 220px; background: #f4f7fb; border-right: 1px solid rgba(148,163,184,0.35); padding: 10px; overflow-y: auto; }
  .mac-chat .main { flex: 1; display: flex; flex-direction: column; }
  .mac-msgs { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; background: #fff; }
  .mac-msg { max-width: 70%; padding: 8px 12px; border-radius: 16px; font-size: 13px; line-height: 1.4; word-wrap: break-word; }
  .mac-msg.me { align-self: flex-end; background: linear-gradient(135deg, #60a5fa, #2563eb); color: #fff; border-bottom-right-radius: 4px; }
  .mac-msg.them { align-self: flex-start; background: #e5e7eb; color: #111827; border-bottom-left-radius: 4px; }
  .mac-composer { padding: 10px; border-top: 1px solid rgba(148,163,184,0.35); display: flex; gap: 8px; background: #f6f8fb; }
  .mac-composer input { flex: 1; padding: 8px; border: 1px solid rgba(148,163,184,0.8); border-radius: 16px; outline: none; }
  .mac-composer button { background: linear-gradient(135deg, #60a5fa, #2563eb); color: #fff; border: none; border-radius: 50%; width: 32px; height: 32px; cursor: pointer; font-size: 16px; display: grid; place-items: center; }

  .ft-container { display: flex; flex-direction: column; height: 100%; background: #0a0d15; color: #fff; position: relative; }
  .ft-video-area { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; background: #000; overflow: hidden; }
  .ft-local-video { position: absolute; bottom: 20px; right: 20px; width: 200px; height: 150px; background: #333; border-radius: 10px; object-fit: cover; border: 2px solid rgba(255,255,255,0.16); z-index: 10; box-shadow: 0 8px 20px rgba(0,0,0,0.25); }
  .ft-remote-video { width: 100%; height: 100%; object-fit: cover; }
  .ft-controls { height: 80px; background: #121827; display: flex; align-items: center; justify-content: center; gap: 20px; position: absolute; bottom: 0; width: 100%; z-index: 20; }
  .ft-btn { width: 50px; height: 50px; border-radius: 50%; border: none; font-size: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.2s; }
  .ft-btn:hover { transform: scale(1.1); }
  .ft-btn.end { background: #ff3b30; color: white; }
  .ft-btn.start { background: #34c759; color: white; }
  .ft-btn.toggle { background: #555; color: white; }
  .ft-btn.toggle.off { background: #ff3b30; }
  .ft-setup { padding: 40px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; height: 100%; }
  .ft-setup input { width: 100%; max-width: 300px; padding: 12px; border-radius: 8px; border: none; text-align: center; font-size: 16px; outline: none; }
  .ft-code { font-size: 24px; font-weight: bold; letter-spacing: 2px; color: #34c759; margin: 10px 0; background: #111827; padding: 10px 20px; border-radius: 8px; }

  .term-body { background: #000; color: #fff; font-family: "Courier New", Courier, monospace; height: 100%; padding: 10px; display: flex; flex-direction: column; }
  .term-out { flex: 1; overflow: auto; white-space: pre-wrap; font-size: 13px; line-height: 1.5; }
  .term-input-line { display: flex; gap: 8px; margin-top: 8px; }
  .term-input-line input { flex: 1; background: transparent; border: none; color: #fff; outline: none; font-family: inherit; font-size: 13px; }

  .music-player { padding: 20px; text-align: center; }
  .music-art { width: 150px; height: 150px; background: linear-gradient(45deg, #f9a8d4, #c4b5fd); border-radius: 18px; margin: 0 auto 20px; box-shadow: 0 10px 24px rgba(0,0,0,0.18); display: grid; place-items: center; font-size: 52px; }

  .tv-body { background: #04070d; color: #fff; height: 100%; overflow-y: auto; padding-bottom: 30px; font-family: -apple-system, sans-serif; }
  .tv-hero {
    height: 290px; position: relative; background-size: cover; background-position: center; display: flex; flex-direction: column; justify-content: flex-end; padding: 20px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  .tv-hero::before { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.15) 40%, rgba(0,0,0,0.35) 100%); }
  .tv-hero-content { position: relative; z-index: 2; }
  .tv-badges { display: flex; gap: 8px; margin-bottom: 8px; }
  .tv-badges span {
    display: inline-flex; padding: 5px 10px; border-radius: 999px; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
    background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2); backdrop-filter: blur(8px); font-weight: 700;
  }
  .tv-hero h2 { margin: 0 0 10px; font-size: 30px; font-weight: 800; }
  .tv-hero p { margin: 0 0 15px; font-size: 13px; color: #d9e7ff; max-width: 460px; line-height: 1.5; }
  .tv-actions { display: flex; gap: 10px; }
  .tv-btn {
    border: none; padding: 10px 18px; border-radius: 20px; font-size: 13px; font-weight: 700; cursor: pointer; letter-spacing: 0.02em;
    transition: transform 0.2s ease, filter 0.2s ease;
  }
  .tv-btn:hover { transform: translateY(-1px); filter: brightness(1.06); }
  .tv-btn.primary { background: linear-gradient(135deg, #f2f8ff, #cfe4ff); color: #081625; }
  .tv-btn.secondary { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.18); }
  .tv-row { padding: 20px 20px 0; }
  .tv-row h3 { margin: 0 0 10px; font-size: 18px; font-weight: 700; color: #fff; }
  .tv-scroll { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
  .tv-scroll::-webkit-scrollbar { display: none; }
  .tv-card { min-width: 140px; width: 140px; cursor: pointer; transition: transform 0.2s ease, filter 0.2s ease; }
  .tv-card:hover { transform: scale(1.04); filter: brightness(1.08); }
  .tv-thumb { width: 140px; height: 210px; border-radius: 12px; background-size: cover; background-position: center; box-shadow: 0 14px 22px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.08); }
  .tv-title { font-size: 12px; color: #d9e7ff; margin-top: 8px; text-align: center; font-weight: 600; }

  .finder-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 20px; padding: 20px; text-align: center; }
  .finder-item { cursor: pointer; padding: 10px; border-radius: 10px; }
  .finder-item:hover { background: rgba(2,6,17,0.04); }
  .finder-item .icon { font-size: 40px; margin-bottom: 5px; }
  .notes-textarea { width: 100%; height: 100%; border: none; padding: 20px; font-size: 15px; outline: none; resize: none; font-family: inherit; background: #f8fafc; }

  #boot { position: fixed; inset: 0; z-index: 10000; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.5s; }
  #boot.fade { opacity: 0; pointer-events: none; }
  #boot .apple-logo { font-size: 80px; color: #fff; margin-bottom: 20px; animation: pulse 2s infinite; }
  #boot .bar { width: 200px; height: 4px; background: #333; border-radius: 2px; overflow: hidden; }
  #boot .bar div { width: 0%; height: 100%; background: linear-gradient(90deg, #7dd3fc, #60a5fa, #c4b5fd); animation: load 2s forwards; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  @keyframes load { to { width: 100%; } }

  @media (max-width: 768px) {
    #widgets, #desktop-icons { display: none; }
    #clock { font-size: 72px; top: 25%; }
    .win { width: 100vw !important; height: calc(100vh - 28px) !important; top: 28px !important; left: 0 !important; border-radius: 0; margin: 0; }
    .win-header { border-radius: 0; }
    #dock { max-width: 95vw; overflow-x: auto; }
    .dock-item { width: 45px; height: 45px; min-width: 45px; font-size: 28px; }
    #quick-actions { left: 16px; right: 16px; top: 42px; }
  }
</style>
</head>
<body>

<div id="boot"><div class="apple-logo"></div><div class="bar"><div></div></div></div>
<div id="wallpaper"></div>

<div id="menubar">
  <div class="menu-left">
    <span class="apple-logo"></span>
    <span class="menu-item" style="font-weight:700">Finder</span>
    <span class="menu-item">File</span>
    <span class="menu-item">Edit</span>
    <span class="menu-item">View</span>
    <span class="menu-item">Go</span>
    <span class="menu-item">Window</span>
    <span class="menu-item">Help</span>
  </div>
  <div class="menu-right">
    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.92.54-1.98.86-3.1.86-3.12 0-5.65-2.53-5.65-5.65 0-1.26.4-2.42 1.08-3.39L11 10v1c0 1.66 1.34 3 3 3h1.25l1.2 2.17c.42-.28.8-.62 1.11-1.02l-1.27-2.15H15v-1.5c0-.83-.67-1.5-1.5-1.5H9.95l-1.3-1.06A7.99 7.99 0 0 1 12 4c4.41 0 8 3.59 8 8 0 2.78-1.42 5.22-3.6 6.66z"/></svg>
    <svg viewBox="0 0 24 24"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4zM11 20H9v-2h2v2zm0-4H9v-2h2v2zm4-4h-2v2h2v2h-2v2h2v-2h2v-2h-2v-2zm-4-4H9V8h2v2zm2-2h2v2h-2V8zm0 4h2v2h-2v-2z"/></svg>
    <svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
    <span class="menu-item" id="menu-clock">Sun Oct 18 12:21 PM</span>
  </div>
</div>

function updateTime() {
  const now = new Date();
  $('#menu-clock').textContent = now.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' }) + ' ' + now.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
  $('#clock').textContent = now.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
}
setInterval(updateTime, 1000); updateTime();

let zTop = 1000;
const openWins = {};

function updateDockState() {
  document.querySelectorAll('.dock-item').forEach(el => {
    const id = el.dataset.app;
    if (openWins[id] && document.body.contains(openWins[id]) && openWins[id].style.display !== 'none') el.classList.add('active');
    else el.classList.remove('active');
  });
}

function makeWindow(title, html, opts = {}) {
  const win = document.createElement('div');
  win.className = 'win';
  if (window.innerWidth > 768) {
    win.style.width = (opts.w || 760) + 'px'; win.style.height = (opts.h || 520) + 'px';
    const n = document.querySelectorAll('#desk-windows .win').length;
    win.style.left = Math.max(10, Math.min(window.innerWidth/2 - (opts.w||760)/2 + (n*20), window.innerWidth - 400)) + 'px';
    win.style.top = Math.max(40, Math.min(window.innerHeight/2 - (opts.h||520)/2 + (n*20), window.innerHeight - 300)) + 'px';
  } else {
    win.style.width = '100vw'; win.style.height = 'calc(100vh - 28px)'; win.style.left = '0'; win.style.top = '28px';
  }
  win.style.zIndex = ++zTop;
  win.innerHTML = `
    <div class="win-header">
      <div class="traffic-lights"><div class="tl close"></div><div class="tl min"></div><div class="tl max"></div></div>
      <div class="win-title">${title}</div>
    </div>
    <div class="win-body">${html}</div>
  `;
  document.getElementById('desk-windows').appendChild(win);

  const head = win.querySelector('.win-header');
  let dragging = false, sx = 0, sy = 0, ox = 0, oy = 0;
  head.addEventListener('pointerdown', e => {
    if (e.target.closest('.tl') || window.innerWidth <= 768) return;
    dragging = true; sx = e.clientX; sy = e.clientY; ox = parseFloat(win.style.left); oy = parseFloat(win.style.top);
    head.setPointerCapture(e.pointerId);
  });
  head.addEventListener('pointermove', e => {
    if (!dragging) return;
    win.style.left = Math.max(-40, Math.min(window.innerWidth - 100, ox + e.clientX - sx)) + 'px';
    win.style.top = Math.max(28, Math.min(window.innerHeight - 60, oy + e.clientY - sy)) + 'px';
  });
  head.addEventListener('pointerup', () => { dragging = false; });
  win.addEventListener('pointerdown', () => { win.style.zIndex = ++zTop; });

  win.querySelector('.close').onclick = () => { win.remove(); delete openWins[opts.id]; updateDockState(); };
  win.querySelector('.min').onclick = () => { win.style.display = 'none'; updateDockState(); };
  win.querySelector('.max').onclick = () => {
    if (win.style.width === '100vw') { win.style.width = (opts.w || 760) + 'px'; win.style.height = (opts.h || 520) + 'px'; win.style.left = '100px'; win.style.top = '100px'; }
    else { win.style.width = '100vw'; win.style.height = 'calc(100vh - 28px)'; win.style.left = '0'; win.style.top = '28px'; }
  };
  updateDockState();
  return win;
}

async function appGames() {
  const body = `
    <div style="padding:15px 20px 0;">
      <div style="display:flex; gap:10px; margin-bottom:15px; align-items:center; flex-wrap:wrap;">
        <input id="g-search" class="app-input" style="flex:1; min-width:220px; margin:0;" placeholder="Search games..."><button class="app-btn" id="g-add">+ Add Game</button>
      </div>
      <div style="font-size:12px; color:#475569; margin-bottom:10px;" id="g-status">Loading library...</div>
    </div>
    <div class="game-grid" id="g-grid"></div>
    <div style="text-align:center; padding:20px;" id="g-more"></div>
  `;

  const win = makeWindow('Games', body, { id: 'games', w: 950, h: 660 });
  const grid = win.querySelector('#g-grid'), status = win.querySelector('#g-status'), moreEl = win.querySelector('#g-more');

  let allGames = [];
  let displayedCount = 100, searchQuery = '';

  function render() {
    const q = searchQuery.toLowerCase();
    const matches = q ? allGames.filter(g => (g.name||'').toLowerCase().includes(q)) : allGames;
    const toRender = q ? matches.slice(0, 300) : matches.slice(0, displayedCount);

    grid.innerHTML = '';
    toRender.forEach(g => {
      const d = document.createElement('div');
      d.className = 'game-tile';
      d.innerHTML = `<div class="ico">${g.ico || '🎮'}</div><div class="nm">${g.name}</div>`;
      d.onclick = () => launchGame(g);
      grid.appendChild(d);
    });

    if (matches.length === 0) grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:#475569;padding:20px;">No games found.</div>';

    moreEl.innerHTML = '';
    if (!q && matches.length > displayedCount) {
      const btn = document.createElement('button');
      btn.className = 'app-btn sec';
      btn.textContent = `Load More (${matches.length - displayedCount} left)`;
      btn.onclick = () => { displayedCount += 200; render(); win.querySelector('.win-body').scrollTop = win.querySelector('.win-body').scrollHeight; };
      moreEl.appendChild(btn);
    }
  }

  win.querySelector('#g-search').oninput = e => { searchQuery = e.target.value; render(); };
  win.querySelector('#g-add').onclick = () => {
    const u = prompt('Enter a game URL or site URL that can be embedded:');
    if (u) launchGame({ name: 'Custom Game', ico: '🔗', url: u });
  };

  allGames.push(
    { name: 'GTA V Fan Project', ico: '🚗', type: 'embed', url: 'https://eta5.vercel.app/play?artwork=regular' },
    { name: 'Snake', ico: '🐍', type: 'inline', fn: 'snake' },
    { name: 'Hextris', ico: '⬡', type: 'embed', url: 'https://hextris.io/' },
    { name: '2048', ico: '🔢', type: 'embed', url: 'https://play2048.co/' },
    { name: 'Doom', ico: '👹', type: 'embed', url: 'https://archive.org/embed/doom-play' },
    { name: 'Asteroids', ico: '🚀', type: 'embed', url: 'https://www.crazygames.com/game/asteroids-x' },
    { name: 'Tetris', ico: '🧩', type: 'embed', url: 'https://tetris.com/play-tetris' },
    { name: 'Pacman', ico: '◼️', type: 'embed', url: 'https://archive.org/embed/pacman' },
    { name: 'Space Run', ico: '🌌', type: 'embed', url: 'https://www.crazygames.com/game/space-run' },
    { name: 'Racer', ico: '🏎️', type: 'embed', url: 'https://www.crazygames.com/game/top-speed-racing-3d' },
    { name: 'Zombie Survival', ico: '🧟', type: 'embed', url: 'https://www.crazygames.com/game/zombie-survival' },
    { name: 'Balloon Pop', ico: '🎈', type: 'embed', url: 'https://www.crazygames.com/game/balloon-pop' }
  );

  status.textContent = 'Fetching archive and public game collection...';
  render();

  try {
    const collections = ['softwarelibrary_msdos_games', 'internetarcade', 'softwarelibrary_apple_II'];
    const requests = collections.map(c => fetch(`https://archive.org/advancedsearch.php?q=collection%3A${c}&fl%5B%5D=identifier&fl%5B%5D=title&rows=200&output=json`).then(r => r.json()).catch(() => ({ response: { docs: [] } })));
    const results = await Promise.all(requests);
    let archiveGames = [];
    results.forEach(data => {
      if (data && data.response && data.response.docs) {
        data.response.docs.forEach(doc => {
          if (doc.title && doc.identifier) archiveGames.push({ name: doc.title, ico: '💾', type: 'embed', url: 'https://archive.org/embed/' + doc.identifier });
        });
      }
    });
    allGames = [...allGames, ...archiveGames.slice(0, 100)];
    status.textContent = `Loaded ${allGames.length} games successfully.`;
    render();
  } catch (e) {
    status.textContent = `Loaded ${allGames.length} games successfully.`;
    render();
  }
}

function launchGame(g) {
  if (g.type === 'inline' && g.fn === 'snake') {
    const body = `
      <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; background:linear-gradient(180deg,#0f172a,#111827);">
        <canvas id="snake-canvas" width="400" height="400" style="background:#0b1220; border-radius:12px; box-shadow:0 0 20px rgba(96,165,250,0.25); border:1px solid rgba(96,165,250,0.25);"></canvas>
        <div style="color:#e2e8f0; margin-top:15px; font-family:monospace; font-weight:700;">Use Arrow Keys or WASD</div>
      </div>
    `;
    const win = makeWindow('Snake', body, { w: 500, h: 520 });
    const canvas = win.querySelector('#snake-canvas'), ctx = canvas.getContext('2d');
    const box = 20;
    let snake = [{x: 10 * box, y: 10 * box}], direction = 'RIGHT';
    let food = { x: Math.floor(Math.random()*19+1) * box, y: Math.floor(Math.random()*19+1) * box };
    let score = 0, gameLoop;

    function draw() {
      ctx.fillStyle = '#0b1220'; ctx.fillRect(0, 0, 400, 400);
      snake.forEach((segment, index) => { ctx.fillStyle = index === 0 ? '#4ade80' : '#60a5fa'; ctx.fillRect(segment.x, segment.y, box-2, box-2); });
      ctx.fillStyle = '#f87171'; ctx.fillRect(food.x, food.y, box-2, box-2);
      ctx.fillStyle = '#fff'; ctx.font = '20px monospace'; ctx.fillText('Score: ' + score, 10, 30);
    }
    function update() {
      const head = { ...snake[0] };
      if (direction === 'LEFT') head.x -= box; if (direction === 'RIGHT') head.x += box;
      if (direction === 'UP') head.y -= box; if (direction === 'DOWN') head.y += box;
      if (head.x < 0 || head.x >= 400 || head.y < 0 || head.y >= 400) { clearInterval(gameLoop); alert('Game Over! Score: ' + score); return; }
      for (let i = 1; i < snake.length; i++) { if (head.x === snake[i].x && head.y === snake[i].y) { clearInterval(gameLoop); alert('Game Over! Score: ' + score); return; } }
      if (head.x === food.x && head.y === food.y) { score += 10; food = { x: Math.floor(Math.random()*19+1) * box, y: Math.floor(Math.random()*19+1) * box }; }
      else { snake.pop(); }
      snake.unshift(head); draw();
    }
    win.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();
      if ((key === 'arrowleft' || key === 'a') && direction !== 'RIGHT') direction = 'LEFT';
      if ((key === 'arrowright' || key === 'd') && direction !== 'LEFT') direction = 'RIGHT';
      if ((key === 'arrowup' || key === 'w') && direction !== 'DOWN') direction = 'UP';
      if ((key === 'arrowdown' || key === 's') && direction !== 'UP') direction = 'DOWN';
    });
    draw(); gameLoop = setInterval(update, 120);
    const obs = new MutationObserver(() => { if (!document.body.contains(win)) { clearInterval(gameLoop); obs.disconnect(); } });
    obs.observe(document.body, { childList: true, subtree: true });
    return;
  }

  const body = `
    <div style="display:flex; flex-direction:column; height:100%;">
      <div style="padding:8px 12px; background:#f8fafc; border-bottom:1px solid rgba(148,163,184,0.3); display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap;">
        <span style="font-size:12px; color:#475569; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:200px;">${g.url}</span>
        <button class="app-btn sec" onclick="window.open('${g.url}', '_blank')">Open Externally</button>
      </div>
      <iframe src="${g.url}" style="flex:1; border:none; width:100%; background:#000;" allow="fullscreen; autoplay"></iframe>
    </div>
  `;
  makeWindow(g.name, body, { w: 950, h: 650 });
}

function appDoblox() {
  const body = `<div id="doblox-container" style="width:100%; height:100%; position:relative; background:linear-gradient(180deg,#7dd3fc,#dbeafe); overflow:hidden;"><div style="position:absolute; top:10px; left:10px; background:rgba(15,23,42,0.55); color:#fff; padding:8px 12px; border-radius:10px; font-weight:700;">Doblox Studio</div></div>`;
  const win = makeWindow('Doblox Studio', body, {id:'doblox', w:800, h:600});
  const container = win.querySelector('#doblox-container');

  const scene = new THREE.Scene(); scene.background = new THREE.Color(0x87CEEB);
  const camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setSize(container.clientWidth, container.clientHeight); container.appendChild(renderer.domElement);
  scene.add(new THREE.AmbientLight(0xffffff, 0.6)); const dirLight = new THREE.DirectionalLight(0xffffff, 0.8); dirLight.position.set(10, 20, 10); scene.add(dirLight);
  const gridHelper = new THREE.GridHelper(50, 50, 0x000000, 0x444444); scene.add(gridHelper);

  const cube = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 2), new THREE.MeshStandardMaterial({ color: 0x22c55e, roughness: 0.5 }));
  cube.position.y = 1; scene.add(cube);
  camera.position.set(0, 5, 10); camera.lookAt(cube.position);

  const keys = { w: false, a: false, s: false, d: false };
  win.addEventListener('keydown', (e) => { const k = e.key.toLowerCase(); if(keys.hasOwnProperty(k)) keys[k] = true; });
  win.addEventListener('keyup', (e) => { const k = e.key.toLowerCase(); if(keys.hasOwnProperty(k)) keys[k] = false; });

  let reqId;
  function animate() {
    reqId = requestAnimationFrame(animate);
    if(keys.w) cube.position.z -= 0.2; if(keys.s) cube.position.z += 0.2;
    if(keys.a) cube.position.x -= 0.2; if(keys.d) cube.position.x += 0.2;
    camera.position.x = cube.position.x; camera.position.z = cube.position.z + 10; camera.lookAt(cube.position);
    renderer.render(scene, camera);
  }
  animate();
  const obs = new MutationObserver(() => { if (!document.body.contains(win)) { cancelAnimationFrame(reqId); renderer.dispose(); obs.disconnect(); } });
  obs.observe(document.body, { childList: true, subtree: true });
}

      <div class="ft-setup" id="ft-setup">
        <h2 style="margin:0; font-weight:300;">FaceTime</h2>
        <p style="color:#aaa;">To start a call, allow camera/mic access.</p>
        <button class="app-btn start" id="ft-allow" style="padding:12px 24px; font-size:16px; border-radius:20px;">Allow Camera & Mic</button>
        <div id="ft-active" style="display:none; text-align:center; width:100%;">
          <p style="margin-bottom:5px;">Your FaceTime ID:</p>
          <div class="ft-code" id="ft-my-id">Connecting...</div>
          <p style="color:#aaa; font-size:12px;">Share this ID so others can call you.</p>
          <hr style="border-color:#333; margin:20px 0; width:80%;">
          <p style="margin-bottom:5px;">Or call a friend:</p>
          <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
            <input type="text" id="ft-remote-id" placeholder="Enter their FaceTime ID" style="width:200px;">
            <button class="app-btn start" id="ft-call-btn">Call</button>
          </div>
        </div>
      </div>
      <div class="ft-video-area" id="ft-video-area" style="display:none;">
        <video id="ft-remote-video" class="ft-remote-video" autoplay></video>
        <video id="ft-local-video" class="ft-local-video" autoplay muted></video>
        <div id="ft-status" style="position:absolute; top:20px; left:20px; background:rgba(0,0,0,0.6); padding:8px 16px; border-radius:12px; font-weight:600;">Connecting...</div>
      </div>
      <div class="ft-controls" id="ft-controls" style="display:none;">
        <button class="ft-btn toggle" id="ft-mute-btn" title="Mute">🎤</button>
        <button class="ft-btn toggle" id="ft-video-btn" title="Turn off camera">📹</button>
        <button class="ft-btn end" id="ft-end" title="End Call">📞</button>
      </div>
    </div>
  `;
  const win = makeWindow('FaceTime', body, { id: 'facetime', w: 800, h: 600 });
  const setupDiv = win.querySelector('#ft-setup'), videoArea = win.querySelector('#ft-video-area'), controls = win.querySelector('#ft-controls');
  const localVideo = win.querySelector('#ft-local-video'), remoteVideo = win.querySelector('#ft-remote-video'), statusText = win.querySelector('#ft-status');
  let isMuted = false, isVideoOff = false;

  win.querySelector('#ft-allow').onclick = async () => {
    try {
      ftStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      localVideo.srcObject = ftStream;
      win.querySelector('#ft-allow').style.display = 'none'; win.querySelector('#ft-active').style.display = 'block';
      win.querySelector('#ft-my-id').textContent = ftPeer.id || 'Connecting...';
      ftPeer.on('open', id => { win.querySelector('#ft-my-id').textContent = id; });
      ftPeer.on('call', call => {
        if(confirm("Incoming FaceTime call! Answer?")) {
          call.answer(ftStream); setupDiv.style.display = 'none'; videoArea.style.display = 'block'; controls.style.display = 'flex';
          call.on('stream', remoteStream => { remoteVideo.srcObject = remoteStream; statusText.textContent = "In Call"; });
        } else { call.close(); }
      });
    } catch(err) { alert("Camera/Mic access denied.\n" + err.message); }
  };
  win.querySelector('#ft-call-btn').onclick = () => {
    const remoteId = win.querySelector('#ft-remote-id').value.trim(); if(!remoteId) return;
    setupDiv.style.display = 'none'; videoArea.style.display = 'block'; controls.style.display = 'flex';
    statusText.textContent = "Calling " + remoteId + "...";
    const call = ftPeer.call(remoteId, ftStream);
    call.on('stream', remoteStream => { remoteVideo.srcObject = remoteStream; statusText.textContent = "In Call with " + remoteId; });
    call.on('error', err => { statusText.textContent = "Call failed."; alert("Call failed. Ensure ID is correct."); });
  };
  win.querySelector('#ft-mute-btn').onclick = (e) => { isMuted = !isMuted; ftStream.getAudioTracks()[0].enabled = !isMuted; e.target.classList.toggle('off', isMuted); };
  win.querySelector('#ft-video-btn').onclick = (e) => { isVideoOff = !isVideoOff; ftStream.getVideoTracks()[0].enabled = !isVideoOff; e.target.classList.toggle('off', isVideoOff); };
  win.querySelector('#ft-end').onclick = () => { if(ftStream) ftStream.getTracks().forEach(t => t.stop()); if(ftPeer) ftPeer.destroy(); ftPeer = null; win.remove(); };
}

function appChat() {
  if (!state.user) return makeWindow('Messages', `<div class="app-pad"><h3>No Account</h3><p>Please set a username in Settings first.</p></div>`, {id:'chat', w:400, h:200});
  const body = `
    <div class="mac-chat">
      <div class="side">
        <div style="font-weight:700; margin-bottom:10px; font-size:14px;">@${state.user}</div>
        <input class="app-input" id="c-search" placeholder="Search users...">
        <div id="c-results" style="margin-top:10px;"></div>
      </div>
      <div class="main">
        <div class="mac-msgs" id="c-msgs"><div style="margin:auto; color:#888;">Search for a friend to chat.</div></div>
        <div class="mac-composer"><input id="c-input" placeholder="iMessage" disabled autocomplete="off"><button id="c-send" disabled>↑</button></div>
      </div>
    </div>
  `;
  const win = makeWindow('Messages', body, {id:'chat', w:700, h:500});
  const msgsEl = win.querySelector('#c-msgs'), input = win.querySelector('#c-input'), sendBtn = win.querySelector('#c-send');
  let partner = null, pollInterval = null;

  const getUsers = () => JSON.parse(localStorage.getItem('obl_users') || '[]');
  const getMsgs = (a,b) => JSON.parse(localStorage.getItem('obl_chat_' + [a,b].sort().join('__')) || '[]');

  function openConvo(name) {
    partner = name; input.disabled = false; sendBtn.disabled = false; input.focus();
    if(pollInterval) clearInterval(pollInterval);
    pollInterval = setInterval(() => {
      if (!document.body.contains(win)) { clearInterval(pollInterval); return; }
      const m = getMsgs(state.user, partner);
      if(msgsEl.dataset.count == m.length) return;
      msgsEl.dataset.count = m.length;
      msgsEl.innerHTML = m.length === 0 ? '<div style="margin:auto; color:#888;">No messages yet.</div>' : '';
      m.forEach(msg => {
        const d = document.createElement('div'); d.className = 'mac-msg ' + (msg.from === state.user ? 'me' : 'them'); d.textContent = msg.text; msgsEl.appendChild(d);
      });
      msgsEl.scrollTop = msgsEl.scrollHeight;
    }, 500);
  }

  win.querySelector('#c-search').oninput = e => {
    const q = e.target.value.toLowerCase(), res = win.querySelector('#c-results'); res.innerHTML = '';
    if(!q) return;
    getUsers().filter(u => u !== state.user && u.toLowerCase().includes(q)).forEach(u => {
      const d = document.createElement('div'); d.style.cssText = 'padding:8px; cursor:pointer; border-radius:6px; font-size:13px;';
      d.textContent = '@' + u; d.onmouseover = () => d.style.background = '#e5e7eb'; d.onmouseout = () => d.style.background = 'transparent';
      d.onclick = () => openConvo(u); res.appendChild(d);
    });
  };

  function send() {
    const text = input.value.trim(); if(!text || !partner) return;
    const m = getMsgs(state.user, partner); m.push({ from: state.user, to: partner, text });
    localStorage.setItem('obl_chat_' + [state.user, partner].sort().join('__'), JSON.stringify(m));
    input.value = ''; msgsEl.dataset.count = 0; openConvo(partner);
  }
  sendBtn.onclick = send; input.addEventListener('keydown', e => { if(e.key === 'Enter') send(); });
}

function appReminders() {
  const body = `
    <div class="app-pad">
      <div style="display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap;">
        <input class="app-input" id="rem-input" placeholder="Add a reminder..." style="margin:0; flex:1; min-width:220px;">

    </div>
  `;
  const win = makeWindow('Reminders', body, {id:'reminders', w:500, h:500});
  const list = win.querySelector('#rem-list');
  let rems = JSON.parse(localStorage.getItem('obl_reminders') || '[]');

  function render() {
    list.innerHTML = '';
    rems.forEach((r, i) => {
      const div = document.createElement('div');
      div.style.cssText = 'display:flex; align-items:center; gap:10px; padding:10px; border-bottom:1px solid #e5e7eb; cursor:pointer;';
      div.innerHTML = `<input type="checkbox" ${r.done ? 'checked' : ''}><span style="${r.done ? 'text-decoration:line-through; color:#94a3b8;' : ''}">${r.text}</span>`;
      div.querySelector('input').onchange = (e) => { rems[i].done = e.target.checked; localStorage.setItem('obl_reminders', JSON.stringify(rems)); render(); };
      list.appendChild(div);
    });

  win.querySelector('#rem-add').onclick = () => {
    const v = win.querySelector('#rem-input').value.trim(); if(!v) return;
    rems.push({ text: v, done: false }); localStorage.setItem('obl_reminders', JSON.stringify(rems));
    win.querySelector('#rem-input').value = ''; render();
  };
  render();
}

function appTerminal() {
  const body = `<div class="term-body"><div id="t-out" class="term-out"></div><div class="term-input-line"><span style="color:#34c759;">user@oblivian ~ %</span><input id="t-in" autocomplete="off" /></div></div>`;
  const win = makeWindow('Terminal', body, {id:'terminal', w:600, h:400});
  const out = win.querySelector('#t-out'), inp = win.querySelector('#t-in');
  const print = s => { out.textContent += s + '\n'; out.scrollTop = out.scrollHeight; };
  print('Last login: ' + new Date().toUTCString() + ' on ttys000');
  win.addEventListener('click', () => inp.focus());
  inp.addEventListener('keydown', e => {
    if(e.key === 'Enter') {
      const cmd = inp.value.trim(); inp.value = ''; print('user@oblivian ~ % ' + cmd);
      if(cmd === 'help') print('Commands: help, neofetch, clear, date');
      else if(cmd === 'clear') out.textContent = '';
      else if(cmd === 'date') print(new Date().toString());
      else if(cmd === 'neofetch') print('OS: OblivianOS\nUser: ' + (state.user || 'guest') + '\nHost: Web Browser');
      else if(cmd !== '') print(`zsh: command not found: ${cmd}`);
    }
  });
  setTimeout(() => inp.focus(), 100);
}

function buildDock() {
  const dock = $('#dock');
  dock.innerHTML = '';
  DOCK_APPS.forEach(app => {
    if(app.divider) { const div = document.createElement('div'); div.className = 'dock-divider'; dock.appendChild(div); return; }
    const d = document.createElement('div');
    d.className = 'dock-item'; d.dataset.app = app.id;
    d.innerHTML = `<span class="tooltip">${app.name}</span>${app.icon}<div class="dot-indicator"></div>`;
    d.onclick = () => {
      const existing = openWins[app.id];
      if(existing && document.body.contains(existing)) {
        if(existing.style.display === 'none') { existing.style.display = 'flex'; existing.style.zIndex = ++zTop; }
        else { existing.style.display = 'none'; }
        updateDockState();
      } else {
        const win = app.fn();
        if(win) openWins[app.id] = win;
      }
    };
    dock.appendChild(d);
  });
}
