<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Cherri</title>
  <style>
    :root {
      --bg: #090909;
      --bg-deep: #0f0b0d;
      --panel: rgba(31, 16, 20, 0.96);
      --panel-2: rgba(28, 17, 20, 0.9);
      --soft: rgba(255, 255, 255, 0.06);
      --soft-2: rgba(255, 255, 255, 0.1);
      --soft-3: rgba(255, 255, 255, 0.14);
      --text: #f7dfe7;
      --muted: rgba(255, 215, 227, 0.65);
      --pink: #ff8bb1;
      --pink-2: #ff5d8f;
      --pink-3: #ffbed1;
      --pink-4: #ff9bc0;
      --dark-pink: #1a0d12;
      --shadow: rgba(0, 0, 0, 0.35);
      --chrome: rgba(20, 15, 18, 0.82);
      --chrome-bezel: rgba(255,255,255,0.03);
      --sidebar: rgba(18, 11, 13, 0.72);
      --grid: rgba(255, 182, 207, 0.08);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
    body {
      background:
        radial-gradient(circle at 50% 25%, rgba(255, 120, 170, 0.09), transparent 18%),
        radial-gradient(circle at 50% 100%, rgba(255, 120, 170, 0.06), transparent 33%),
        #090909;
    }

    .screen {
      position: absolute; inset: 0;
      background:
        linear-gradient(180deg, rgba(18, 9, 12, 0.9), rgba(18, 9, 12, 0.92)),
        #090909;
    }

    .screen::before {
      content: "";
      position: absolute; inset: 0;
      background-image: radial-gradient(var(--grid) 0.8px, transparent 0.8px);
      background-size: 16px 16px;
      opacity: 1;
      pointer-events: none;
    }

    .browser {
      position: absolute;
      left: 50%;
      top: 52%;
      transform: translate(-50%, -50%);
      width: min(1450px, calc(100vw - 90px));
      height: min(900px, calc(100vh - 80px));
      border-radius: 20px;
      overflow: hidden;
      background: rgba(21, 11, 14, 0.9);
      border: 1px solid rgba(255,255,255,0.06);
      box-shadow: 0 40px 70px rgba(0,0,0,0.45), 0 8px 18px rgba(255,129,178,0.08);
    }

    .topbar {
      height: 60px;
      background: rgba(28, 19, 21, 0.96);
      border-bottom: 1px solid rgba(255,255,255,0.03);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 18px 0 14px;
      color: rgba(255,255,255,0.95);
      position: relative;
      z-index: 2;
    }

    .top-left { display: flex; align-items: center; gap: 16px; }
    .traffic {
      display: flex; align-items: center; gap: 9px;
      margin-left: 4px;
    }
    .dot {
      width: 11px; height: 11px; border-radius: 50%; background: rgba(255,255,255,0.12);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1);
    }
    .dot.red { background: #ff6b6b; }
    .dot.yellow { background: #f0c368; }
    .dot.green { background: #73d28f; }

    .address-wrap {
      height: 34px; min-width: 430px; max-width: 790px; flex: 1; display: flex; align-items: center;
      background: rgba(255,255,255,0.035);
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: 12px;
      padding: 0 14px;
      gap: 8px;
      color: rgba(255,255,255,0.75);
      margin: 0 18px 0 0;
    }

    .lock {
      width: 10px; height: 10px; border: 1.5px solid rgba(255,255,255,0.38); border-radius: 2px; position: relative; opacity: 0.8;
    }
    .lock::before {
      content: ""; position: absolute; left: 50%; top: -5px; transform: translateX(-50%);
      width: 7px; height: 6px; border: 1.5px solid rgba(255,255,255,0.38); border-bottom: none; border-radius: 6px 6px 0 0;
    }
    .url { font-size: 14px; color: rgba(255,255,255,0.88); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .nav-icons { display: flex; align-items: center; gap: 12px; color: rgba(255,255,255,0.8); }
    .nav-icons .icon {
      width: 26px; height: 26px; display: grid; place-items: center; border-radius: 8px;
      cursor: pointer; font-size: 16px; opacity: 0.8;
    }
    .nav-icons .icon:hover { background: rgba(255,255,255,0.04); }

    .browser-body {
      position: relative;
      height: calc(100% - 60px);
      background: linear-gradient(180deg, rgba(17, 9, 12, 0.54), rgba(17, 9, 12, 0.72));
    }

    .sidebar {
      position: absolute; left: 0; top: 0; bottom: 0;
      width: 66px; background: rgba(17, 10, 12, 0.6);
      border-right: 1px solid rgba(255,255,255,0.03);
      display: flex; flex-direction: column; align-items: center; padding-top: 14px; gap: 14px;
      z-index: 2;
    }
    .sidebar .sb-btn {
      width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
      background: transparent; color: rgba(255,255,255,0.72); font-size: 16px;
      border: 1px solid transparent;
      transition: all 0.18s ease;
    }
    .sidebar .sb-btn.active {
      background: rgba(255, 144, 177, 0.12);
      color: #ffd7e7;
      border-color: rgba(255, 160, 190, 0.08);
    }
    .sidebar .sb-btn:hover { background: rgba(255,255,255,0.045); }
    .sidebar .sb-bottom {
      margin-top: auto; margin-bottom: 8px; display: flex; flex-direction: column; gap: 12px;
    }

    .content {
      position: absolute; left: 66px; right: 0; top: 0; bottom: 0;
      padding: 18px 24px 12px 24px;
      background: rgba(18, 10, 12, 0.16);
    }

    .tabbar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .tab-shell {
      display: flex; align-items: center; gap: 10px;
      flex: 1;
      min-width: 0;
    }
    .tab {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 8px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.04);
      background: rgba(255,255,255,0.025); color: rgba(255,255,255,0.9); min-width: 116px; max-width: 210px;
      font-size: 13px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    }
    .tab.active {
      background: linear-gradient(180deg, rgba(255,140,178,0.3), rgba(255,130,170,0.12));
      border-color: rgba(255, 181, 209, 0.08);
      color: #ffdfe9;
      box-shadow: inset 0 0 0 1px rgba(255, 160, 190, 0.05);
    }
    .tab .g {
      width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,0.5);
      display: inline-block;
    }
    .tab .g.pink { background: #ff8bb1; }
    .plus {
      width: 28px; height: 28px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.04); background: rgba(255,255,255,0.02); display: grid; place-items: center; color: rgba(255,255,255,0.8);
    }

    .toolbar {
      display: flex; align-items: center; justify-content: space-between;
      height: 54px; background: rgba(255,255,255,0.02); border-radius: 14px; border: 1px solid rgba(255,255,255,0.03);
      padding: 0 12px 0 12px; margin-bottom: 22px;
    }
    .toolbar .left, .toolbar .right { display: flex; align-items: center; gap: 10px; color: rgba(255,255,255,0.7); }
    .tool-box {
      width: 24px; height: 24px; display: grid; place-items: center; border-radius: 6px;
      opacity: 0.85;
    }
    .tool-box:hover { background: rgba(255,255,255,0.04); }
    .address-pill {
      flex: 1; margin: 0 14px; max-width: 840px; height: 32px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.04); padding: 0 12px; display: flex; align-items: center; justify-content: center; font-size: 14px; color: rgba(255,255,255,0.8);
      background: rgba(255,255,255,0.025);
    }
    .address-pill .mini { opacity: 0.9; margin-right: 8px; }

    .hero {
      width: min(650px, 70%); margin: 72px auto 0 auto; text-align: center;
    }
    .brand {
      font-size: clamp(4.2rem, 5vw, 7rem);
      line-height: 0.9;
      letter-spacing: -0.08em;
      margin: 0;
      font-weight: 800;
      color: #fcb2ca;
      text-shadow: 0 0 28px rgba(255, 146, 187, 0.6), 0 0 45px rgba(255, 146, 187, 0.25);
    }
    .sub {
      margin-top: 14px; color: rgba(255, 218, 228, 0.72); font-size: 15px; letter-spacing: 0.01em;
    }

    .search-wrap {
      margin: 36px auto 0 auto;
      width: min(760px, 75%);
      height: 58px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.02); display: flex; align-items: center; padding: 0 12px 0 18px; gap: 12px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.015);
    }
    .search-icon {
      font-size: 20px; color: rgba(255,255,255,0.56); width: 24px; text-align: center;
    }
    .search-input {
      flex: 1; height: 100%; background: transparent; border: none; outline: none;
      color: rgba(255,255,255,0.6); font-size: 16px; font-family: inherit;
    }
    .search-input::placeholder { color: rgba(255,255,255,0.38); }
    .search-go {
      width: 42px; height: 42px; border-radius: 12px; border: none; background: linear-gradient(135deg, #ff9fc3, #ff6f9d);
      color: #2d0714; font-weight: 900; font-size: 26px; display: grid; place-items: center; cursor: pointer; box-shadow: 0 12px 16px rgba(255, 116, 163, 0.25);
    }

    .apps {
      width: min(690px, 80%); margin: 34px auto 0; display: grid; grid-template-columns: repeat(5, minmax(92px, 1fr)); gap: 18px;
    }
    .app-tile {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
      height: 94px; border: 1px solid rgba(255,255,255,0.06); border-radius: 16px; background: rgba(255,255,255,0.02); color: rgba(255,255,255,0.92); font-size: 12px; font-weight: 600;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.02);
    }
    .app-icon {
      width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center;
      font-size: 21px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
    }
    .app-label { opacity: 0.9; }

    .announce {
      width: min(620px, 74%); margin: 28px auto 0 auto; padding: 8px 16px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06); border-radius: 16px; display: flex; align-items: center; justify-content: center; gap: 18px; color: rgba(255,255,255,0.7); font-size: 13px;
    }
    .announce .online { font-weight: 700; color: rgba(255,255,255,0.8); }
    .announce .chip {
      background: rgba(255,180,207,0.08); border: 1px solid rgba(255,180,207,0.15); color: #ffd9e7; font-weight: 700; padding: 7px 12px; border-radius: 999px;
    }

    .widget-card {
      position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); width: min(980px, 85vw); display: flex; align-items: center; justify-content: space-between; gap: 12px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06); border-radius: 18px; padding: 8px 12px; color: rgba(255,255,255,0.74);
    }
    .widget-card .left, .widget-card .mid, .widget-card .right { display: flex; align-items: center; gap: 12px; }
    .widget-card .left { min-width: 180px; }
    .widget-card .mid { justify-content: center; flex: 1; }
    .widget-card .right { justify-content: flex-end; min-width: 180px; }
    .tiny-icon {
      width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.04);
    }
    .widget-card .time {
      font-size: 30px; letter-spacing: -0.06em; color: rgba(255,255,255,0.96); font-weight: 500;
    }
    .widget-card .small { font-size: 12px; color: rgba(255,255,255,0.6); }
    .widget-card .abs {
      font-weight: 600; color: rgba(255,255,255,0.8);
    }

    .dock {
      position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
      width: auto; max-width: calc(100vw - 50px); height: 80px; display: flex; align-items: flex-end; gap: 10px; padding: 10px 10px 8px 10px;
      background: rgba(11, 7, 8, 0.52); border: 1px solid rgba(255,255,255,0.06); border-radius: 18px; box-shadow: 0 18px 30px rgba(0,0,0,0.18);
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    }
    .dock-icon {
      width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); position: relative;
      font-size: 24px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 8px 18px rgba(0,0,0,0.2);
    }
    .dock-icon::before {
      content: ""; position: absolute; left: 50%; bottom: -7px; transform: translateX(-50%); width: 4px; height: 4px; border-radius: 50%; background: rgba(255,255,255,0.75); opacity: 0;
    }
    .dock-icon.active::before { opacity: 1; }
    .dock-sep { width: 1px; height: 36px; background: rgba(255,255,255,0.08); }

    @media (max-width: 980px) {
      .browser { width: calc(100vw - 28px); height: calc(100vh - 28px); }
      .sidebar { width: 56px; }
      .content { left: 56px; }
      .apps { grid-template-columns: repeat(3, minmax(90px, 1fr)); }
      .widget-card { width: calc(100vw - 20px); }
      .address-wrap { min-width: 0; }
      .brand { font-size: clamp(3rem, 14vw, 5.4rem); }
    }
  </style>
</head>
<body>
  <div class="screen">
    <div class="browser">
      <div class="topbar">
        <div class="top-left" style="flex:1; min-width:0;">
          <div class="traffic">
            <span class="dot red"></span>
            <span class="dot yellow"></span>
            <span class="dot green"></span>
          </div>
          <div class="address-wrap">
            <span class="lock"></span>
            <span class="url">objectstorage.us-sanose-1.oraclecloud.com</span>
          </div>
        </div>

        <div class="nav-icons">
          <div class="icon">⤴</div>
          <div class="icon">⋮</div>
        </div>
      </div>

      <div class="browser-body">
        <div class="sidebar">
          <div class="sb-btn active">⌂</div>
          <div class="sb-btn">⌁</div>
          <div class="sb-btn">◫</div>
          <div class="sb-btn">◍</div>
          <div class="sb-btn">◌</div>
          <div class="sb-bottom">
            <div class="sb-btn">⚙</div>
            <div class="sb-btn">⟲</div>
          </div>
        </div>

        <div class="content">
          <div class="tabbar">
            <div class="tab-shell">
              <div class="tab active"><span class="g pink"></span> Home</div>
              <div class="tab"><span class="g"></span> +</div>
            </div>
            <div class="plus">＋</div>
          </div>

          <div class="toolbar">
            <div class="left">
              <div class="tool-box">←</div>
              <div class="tool-box">→</div>
              <div class="tool-box">↻</div>
            </div>
            <div class="address-pill"><span class="mini">⌂</span> cherri/home</div>
            <div class="right">
              <div class="tool-box">▣</div>
              <div class="tool-box">⋮</div>
            </div>
          </div>

          <div class="hero">
            <h1 class="brand">cherri</h1>
            <div class="sub">i switched to linux</div>
          </div>

          <div class="search-wrap">
            <span class="search-icon">⌕</span>
            <input class="search-input" placeholder="Search for anything!" />
            <button class="search-go">→</button>
          </div>

          <div class="apps">
            <div class="app-tile"><div class="app-icon">🎮</div><div class="app-label">Games</div></div>
            <div class="app-tile"><div class="app-icon">🤖</div><div class="app-label">AI</div></div>
            <div class="app-tile"><div class="app-icon">♫</div><div class="app-label">Music</div></div>
            <div class="app-tile"><div class="app-icon">💬</div><div class="app-label">Chat</div></div>
            <div class="app-tile"><div class="app-icon">＋</div><div class="app-label">Add</div></div>
          </div>

          <div class="announce">
            <span class="online">786 users online</span>
            <span>•</span>
            <span class="chip">Join our Discord</span>
          </div>

          <div class="widget-card">
            <div class="left">
              <span class="tiny-icon">◎</span>
              <span class="abs">karbon06</span>
            </div>
            <div class="mid">
              <div class="time">9:27 PM</div>
              <div class="small">Tuesday, October 20</div>
            </div>
            <div class="right">
              <span class="tiny-icon">◉</span>
              <span class="abs">duder</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="dock">
      <div class="dock-icon active">◫</div>
      <div class="dock-icon">◍</div>
      <div class="dock-icon">⌂</div>
      <div class="dock-icon">◌</div>
      <div class="dock-icon">✓</div>
      <div class="dock-sep"></div>
      <div class="dock-icon">🗂</div>
      <div class="dock-icon">📁</div>
      <div class="dock-icon">☰</div>
      <div class="dock-icon">⚙</div>
    </div>
  </div>
</body>
</html>
