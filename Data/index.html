<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>macOS - Oblivian</title>
<!-- PeerJS for FaceTime (WebRTC) -->
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
  /* =========================================
     CORE SYSTEM STYLES & LAYOUT
     ========================================= */
  :root {
    --system-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --accent: #007aff;
  }
  * { box-sizing: border-box; user-select: none; -webkit-user-drag: none; }
  body, html { height: 100%; margin: 0; overflow: hidden; font-family: var(--system-font); background: #000; }
  
  /* The Forest Wallpaper */
  #wallpaper {
    position: fixed; inset: 0; z-index: 0;
    background: url('https://images.unsplash.com/photo-1448375240586-882707db888b?q=80&w=2070&auto=format&fit=crop') center/cover no-repeat;
    transition: background 0.5s ease;
  }

  /* Top Menu Bar */
  #menubar {
    position: fixed; top: 0; left: 0; right: 0; height: 28px; z-index: 9999;
    background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    display: flex; align-items: center; justify-content: space-between; padding: 0 16px;
    color: #000; font-size: 13px; font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,0.05);
  }
  .menu-left, .menu-right { display: flex; gap: 20px; align-items: center; }
  .menu-item { cursor: pointer; opacity: 0.9; transition: opacity 0.2s; }
  .menu-item:hover { opacity: 1; }
  .apple-logo { font-size: 16px; margin-right: 5px; cursor: default; }
  .menu-right svg { width: 16px; height: 16px; fill: currentColor; cursor: pointer; opacity: 0.8; }
  .menu-right svg:hover { opacity: 1; }

  /* Left Widgets */
  #widgets {
    position: absolute; top: 50px; left: 30px; z-index: 10;
    display: flex; flex-direction: column; gap: 15px;
    pointer-events: none;
  }
  .widget {
    background: rgba(255, 255, 255, 0.25); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
    border-radius: 20px; border: 1px solid rgba(255,255,255,0.3); padding: 16px;
    color: #fff; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    width: 170px; pointer-events: auto;
  }
  .w-weather { background: linear-gradient(180deg, #3b82f6, #2563eb); border: none; }
  .w-weather h2 { margin: 0; font-size: 34px; font-weight: 400; }
  .w-weather p { margin: 4px 0; font-size: 14px; font-weight: 500; }
  .w-weather .desc { font-size: 12px; opacity: 0.9; line-height: 1.4; }
  
  .w-battery { text-align: center; }
  .w-battery .ring { width: 60px; height: 60px; border-radius: 50%; border: 6px solid rgba(255,255,255,0.3); border-top-color: #ef4444; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600;}
  
  .w-calendar { height: 160px; }
  .w-calendar .header { color: #ef4444; font-size: 12px; font-weight: 700; text-transform: uppercase; }
  .w-calendar .date { font-size: 40px; font-weight: 300; line-height: 1; margin-top: 5px; color: #000; }
  .w-calendar .event { font-size: 11px; color: #000; margin-top: 10px; line-height: 1.3; }

  /* Center Clock */
  #clock {
    position: absolute; top: 35%; left: 50%; transform: translate(-50%, -50%);
    font-size: 140px; font-weight: 500; color: #fff; letter-spacing: -4px;
    text-shadow: 0 4px 20px rgba(0,0,0,0.3); z-index: 5; pointer-events: none;
    white-space: nowrap;
  }

  /* Desktop Icons */
  #desktop-icons {
    position: absolute; top: 50px; right: 20px; z-index: 10;
    display: flex; flex-direction: column; gap: 20px; align-items: center;
    pointer-events: none;
  }
  .d-icon { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; pointer-events: auto; }
  .d-icon .img { width: 60px; height: 60px; background: #fff; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); display: flex; align-items: center; justify-content: center; font-size: 32px; }
  .d-icon span { color: #fff; font-size: 12px; text-shadow: 0 1px 3px rgba(0,0,0,0.8); text-align: center; font-weight: 500;}

  /* Dock */
  #dock-container {
    position: fixed; bottom: 8px; left: 50%; transform: translateX(-50%); z-index: 9999;
    max-width: 100vw;
  }
  #dock {
    display: flex; gap: 6px; padding: 8px 12px; border-radius: 24px;
    background: rgba(255, 255, 255, 0.25); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
    border: 1px solid rgba(255,255,255,0.3); box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    align-items: flex-end; overflow-x: auto; overflow-y: hidden;
    scrollbar-width: none;
  }
  #dock::-webkit-scrollbar { display: none; }
  .dock-item {
    width: 52px; height: 52px; min-width: 52px; border-radius: 14px; display: flex; align-items: center; justify-content: center;
    font-size: 34px; cursor: pointer; transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
    position: relative;
  }
  .dock-item:hover { transform: scale(1.3) translateY(-10px); margin: 0 6px; }
  .dock-item:hover .tooltip { opacity: 1; }
  .tooltip {
    position: absolute; top: -35px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.7); color: #fff; font-size: 12px; padding: 4px 10px; border-radius: 6px;
    opacity: 0; pointer-events: none; transition: opacity 0.2s; white-space: nowrap;
  }
  .dock-divider { width: 1px; height: 48px; background: rgba(255,255,255,0.3); margin: 0 6px; align-self: center; min-width: 1px; }
  .dot-indicator { position: absolute; bottom: 4px; width: 4px; height: 4px; border-radius: 50%; background: #000; opacity: 0; transition: opacity 0.2s; }
  .dock-item.active .dot-indicator { opacity: 1; }

  /* =========================================
     WINDOW MANAGER STYLES
     ========================================= */
  #desk-windows { position: fixed; inset: 0; z-index: 1000; pointer-events: none; }
  .win {
    position: absolute; pointer-events: auto; display: flex; flex-direction: column; min-width: 400px; min-height: 300px;
    background: #ffffff; border-radius: 12px; overflow: hidden;
    box-shadow: 0 20px 50px rgba(0,0,0,0.4), 0 0 0 1px rgba(0,0,0,0.1);
    animation: pop 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
    resize: both;
  }
  @keyframes pop { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
  
  .win-header {
    height: 38px; background: #f6f6f6; border-bottom: 1px solid #e5e5e5;
    display: flex; align-items: center; padding: 0 12px; cursor: grab; flex-shrink: 0;
  }
  .win-header:active { cursor: grabbing; }
  .traffic-lights { display: flex; gap: 8px; }
  .tl { width: 12px; height: 12px; border-radius: 50%; border: 0.5px solid rgba(0,0,0,0.1); cursor: pointer; }
  .tl.close { background: #ff5f56; }
  .tl.min { background: #ffbd2e; }
  .tl.max { background: #27c93f; }
  .tl.close:hover, .tl.min:hover, .tl.max:hover { filter: brightness(0.8); }
  .win-title { flex: 1; text-align: center; font-size: 13px; font-weight: 600; color: #333; margin-right: 50px; }
  
  .win-body { flex: 1; overflow: auto; background: #fff; color: #333; font-size: 13px; display: flex; flex-direction: column; }

  /* =========================================
     APP-SPECIFIC UI STYLES
     ========================================= */
  .app-pad { padding: 20px; }
  .app-btn { background: var(--accent); color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
  .app-btn:hover { background: #0066cc; }
  .app-btn.sec { background: #e5e5ea; color: #000; }
  .app-btn.sec:hover { background: #d1d1d6; }
  .app-input { width: 100%; padding: 8px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; margin-bottom: 10px; outline: none; font-family: inherit; }
  .app-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.2); }
  
  /* Games Grid */
  .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 15px; padding: 20px; }
  .game-tile { display: flex; flex-direction: column; align-items: center; text-align: center; cursor: pointer; padding: 10px; border-radius: 8px; transition: background 0.2s; }
  .game-tile:hover { background: #f0f0f5; }
  .game-tile .ico { font-size: 40px; margin-bottom: 8px; }
  .game-tile .nm { font-size: 12px; font-weight: 500; color: #333; line-height: 1.2; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-word;}

  /* Chat */
  .mac-chat { display: flex; height: 100%; flex: 1; }
  .mac-chat .side { width: 220px; background: #f6f6f6; border-right: 1px solid #e5e5e5; padding: 10px; overflow-y: auto; }
  .mac-chat .main { flex: 1; display: flex; flex-direction: column; }
  .mac-msgs { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; background: #fff; }
  .mac-msg { max-width: 70%; padding: 8px 12px; border-radius: 16px; font-size: 13px; line-height: 1.4; word-wrap: break-word; }
  .mac-msg.me { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .mac-msg.them { align-self: flex-start; background: #e5e5ea; color: #000; border-bottom-left-radius: 4px; }
  .mac-composer { padding: 10px; border-top: 1px solid #e5e5e5; display: flex; gap: 8px; background: #f6f6f6; }
  .mac-composer input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 16px; outline: none; }
  .mac-composer button { background: var(--accent); color: #fff; border: none; border-radius: 50%; width: 32px; height: 32px; cursor: pointer; font-size: 16px; display: grid; place-items: center; }

  /* FaceTime */
  .ft-container { display: flex; flex-direction: column; height: 100%; background: #1a1a1a; color: #fff; position: relative; }
  .ft-video-area { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; background: #000; overflow: hidden;}
  .ft-local-video { position: absolute; bottom: 20px; right: 20px; width: 200px; height: 150px; background: #333; border-radius: 10px; object-fit: cover; border: 2px solid #555; z-index: 10; box-shadow: 0 10px 20px rgba(0,0,0,0.5);}
  .ft-remote-video { width: 100%; height: 100%; object-fit: cover; }
  .ft-controls { height: 80px; background: #2a2a2a; display: flex; align-items: center; justify-content: center; gap: 20px; position: absolute; bottom: 0; width: 100%; z-index: 20;}
  .ft-btn { width: 50px; height: 50px; border-radius: 50%; border: none; font-size: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.2s;}
  .ft-btn:hover { transform: scale(1.1); }
  .ft-btn.end { background: #ff3b30; color: white; }
  .ft-btn.start { background: #34c759; color: white; }
  .ft-btn.toggle { background: #555; color: white; }
  .ft-btn.toggle.off { background: #ff3b30; }
  .ft-setup { padding: 40px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; height: 100%; }
  .ft-setup input { width: 100%; max-width: 300px; padding: 12px; border-radius: 8px; border: none; text-align: center; font-size: 16px; outline: none;}
  .ft-code { font-size: 24px; font-weight: bold; letter-spacing: 2px; color: #34c759; margin: 10px 0; background: #222; padding: 10px 20px; border-radius: 8px;}

  /* Terminal */
  .term-body { background: #000; color: #fff; font-family: "Courier New", Courier, monospace; height: 100%; padding: 10px; display: flex; flex-direction: column; }
  .term-out { flex: 1; overflow: auto; white-space: pre-wrap; font-size: 13px; line-height: 1.5; }
  .term-input-line { display: flex; gap: 8px; margin-top: 8px; }
  .term-input-line input { flex: 1; background: transparent; border: none; color: #fff; outline: none; font-family: inherit; font-size: 13px; }

  /* Music Player */
  .music-player { padding: 20px; text-align: center; }
  .music-art { width: 150px; height: 150px; background: linear-gradient(45deg, #ff9a9e, #fecfef); border-radius: 10px; margin: 0 auto 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.2); display: grid; place-items: center; font-size: 60px;}
  .music-controls { display: flex; justify-content: center; gap: 15px; margin-top: 20px; font-size: 24px; color: var(--accent); }
  
  /* Boot Screen */
  #boot { position: fixed; inset: 0; z-index: 10000; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.5s; }
  #boot.fade { opacity: 0; pointer-events: none; }
  #boot .apple-logo { font-size: 80px; color: #fff; margin-bottom: 20px; animation: pulse 2s infinite; }
  #boot .bar { width: 200px; height: 4px; background: #333; border-radius: 2px; overflow: hidden; }
  #boot .bar div { width: 0%; height: 100%; background: #fff; animation: load 2s forwards; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  @keyframes load { to { width: 100%; } }
</style>
</head>

<script>
/* =========================================================
   1. SYSTEM STATE & CLOCK
   ========================================================= */
const state = {
  user: JSON.parse(localStorage.getItem('obl_user')) || null
};
const $ = s => document.querySelector(s);

function updateTime() {
  const now = new Date();
  $('#menu-clock').textContent = now.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' }) + ' ' + 
                                 now.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
  $('#clock').textContent = now.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
}
setInterval(updateTime, 1000);
updateTime();

/* =========================================================
   2. WINDOW MANAGER
   ========================================================= */
let zTop = 1000;
const openWins = {};

function updateDockState() {
  document.querySelectorAll('.dock-item').forEach(el => {
    const id = el.dataset.app;
    if (openWins[id] && document.body.contains(openWins[id]) && openWins[id].style.display !== 'none') {
      el.classList.add('active');
    } else {
      el.classList.remove('active');
    }
  });
}

function makeWindow(title, html, opts = {}) {
  const win = document.createElement('div');
  win.className = 'win';
  
  // Set size and position
  win.style.width = (opts.w || 760) + 'px';
  win.style.height = (opts.h || 520) + 'px';
  
  const n = document.querySelectorAll('#desk-windows .win').length;
  win.style.left = Math.max(10, Math.min(window.innerWidth/2 - (opts.w||760)/2 + (n*20), window.innerWidth - 400)) + 'px';
  win.style.top = Math.max(40, Math.min(window.innerHeight/2 - (opts.h||520)/2 + (n*20), window.innerHeight - 300)) + 'px';
  win.style.zIndex = ++zTop;

  win.innerHTML = `
    <div class="win-header">
      <div class="traffic-lights">
        <div class="tl close" title="Close"></div>
        <div class="tl min" title="Minimize"></div>
        <div class="tl max" title="Maximize"></div>
      </div>
      <div class="win-title">${title}</div>
    </div>
    <div class="win-body">${html}</div>
  `;

  document.getElementById('desk-windows').appendChild(win);

  // Drag Logic
  const head = win.querySelector('.win-header');
  let dragging = false, sx = 0, sy = 0, ox = 0, oy = 0;
  head.addEventListener('pointerdown', e => {
    if (e.target.closest('.tl')) return;
    dragging = true; sx = e.clientX; sy = e.clientY;
    ox = parseFloat(win.style.left); oy = parseFloat(win.style.top);
    head.setPointerCapture(e.pointerId);
  });
  head.addEventListener('pointermove', e => {
    if (!dragging) return;
    win.style.left = Math.max(-40, Math.min(window.innerWidth - 100, ox + e.clientX - sx)) + 'px';
    win.style.top = Math.max(28, Math.min(window.innerHeight - 60, oy + e.clientY - sy)) + 'px';
  });
  head.addEventListener('pointerup', () => { dragging = false; });

  win.addEventListener('pointerdown', () => { win.style.zIndex = ++zTop; });

  // Window Controls
  win.querySelector('.close').onclick = () => { win.remove(); delete openWins[opts.id]; updateDockState(); };
  win.querySelector('.min').onclick = () => { win.style.display = 'none'; updateDockState(); };
  win.querySelector('.max').onclick = () => {
    if (win.style.width === '100vw') {
      win.style.width = (opts.w || 760) + 'px'; win.style.height = (opts.h || 520) + 'px';
      win.style.left = '100px'; win.style.top = '100px';
    } else {
      win.style.width = '100vw'; win.style.height = 'calc(100vh - 28px)';
      win.style.left = '0'; win.style.top = '28px';
    }
  };

  updateDockState();
  return win;
}

/* =========================================================
   3. APPLICATIONS
   ========================================================= */

// ---------------------------------------------------------
// APP: GAMES (Massive List + GTA V at top)
// ---------------------------------------------------------
async function appGames() {
  const body = `
    <div style="padding:15px 20px 0;">
      <div style="display:flex; gap:10px; margin-bottom:15px;">
        <input id="g-search" class="app-input" style="flex:1;" placeholder="Search 6000+ games...">
        <button class="app-btn" id="g-add">+ Custom URL</button>
      </div>
      <div style="font-size:12px; color:#666; margin-bottom:10px;" id="g-status">Loading games...</div>
    </div>
    <div class="game-grid" id="g-grid"></div>
    <div style="text-align:center; padding:20px;" id="g-more"></div>
  `;
  
  const win = makeWindow('Games', body, { id: 'games', w: 950, h: 650 });
  const grid = win.querySelector('#g-grid');
  const status = win.querySelector('#g-status');
  const moreEl = win.querySelector('#g-more');
  
  let allGames = [];
  let displayedCount = 100; // Initial load size
  let searchQuery = '';

  // CORE RENDER FUNCTION
  function render() {
    const q = searchQuery.toLowerCase();
    const matches = q ? allGames.filter(g => (g.name||'').toLowerCase().includes(q)) : allGames;
    
    // Only render the chunk we need to prevent browser crash
    const toRender = q ? matches.slice(0, 300) : matches.slice(0, displayedCount);
    
    grid.innerHTML = '';
    toRender.forEach(g => {
      const d = document.createElement('div');
      d.className = 'game-tile';
      d.innerHTML = `<div class="ico">${g.ico || '🎮'}</div><div class="nm">${g.name}</div>`;
      d.onclick = () => launchGame(g);
      grid.appendChild(d);
    });
    
    if (matches.length === 0) {
      grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:#666;padding:20px;">No games found for that search.</div>';
    }
    
    // Pagination Button
    moreEl.innerHTML = '';
    if (!q && matches.length > displayedCount) {
      const btn = document.createElement('button');
      btn.className = 'app-btn sec';
      btn.textContent = `Load More (${matches.length - displayedCount} games left)`;
      btn.onclick = () => { 
        displayedCount += 200; 
        render(); 
        win.querySelector('.win-body').scrollTop = win.querySelector('.win-body').scrollHeight; // scroll down
      };
      moreEl.appendChild(btn);
    }
  }

  win.querySelector('#g-search').oninput = e => {
    searchQuery = e.target.value;
    render();
  };
  
  win.querySelector('#g-add').onclick = () => {
    const u = prompt('Enter Game URL (must allow embedding):');
    if (u) launchGame({ name: 'Custom Game', ico: '🔗', url: u });
  };

  // 1. HARDCODE GTA V AT THE VERY TOP
  allGames.push({ 
    name: 'GTA V (Fan Project)', 
    ico: '🚗', 
    type: 'embed', 
    url: 'https://eta5.vercel.app/play?artwork=regular' 
  });
  
  // 2. Add featured games
  const featured = [
    {name:'Snake', ico:'🐍', type:'inline', fn:'snake'},
    {name:'Hextris', ico:'⬡', type:'embed', url:'https://hextris.io/'},
    {name:'2048', ico:'🔢', type:'embed', url:'https://play2048.co/'},
    {name:'Astray', ico:'🧊', type:'embed', url:'https://wwwtyro.github.io/Astray/'},
    {name:'Doom', ico:'👹', type:'embed', url:'https://archive.org/embed/doom-play'},
    {name:'Wolfenstein 3D', ico:'🪖', type:'embed', url:'https://archive.org/embed/msdos_Wolfenstein_3D_1992'}
  ];
  allGames.push(...featured);
  render(); // Render immediately so user sees GTA at top instantly

  status.textContent = "Fetching archive.org (this may take a moment)...";

  // 3. FETCH ARCHIVE.ORG (Massive library)
  try {
    const collections = [
      'softwarelibrary_msdos_games', 
      'internetarcade', 
      'softwarelibrary_apple_II', 
      'softwarelibrary_atari_2600',
      'softwarelibrary_commodore_64'
    ];
    
    const requests = collections.map(c => 
      fetch(`https://archive.org/advancedsearch.php?q=collection%3A${c}&fl%5B%5D=identifier&fl%5B%5D=title&rows=500&output=json`)
      .then(r => r.json())
      .catch(() => null)
    );
    
    const results = await Promise.all(requests);
    let archiveGames = [];
    
    results.forEach(data => {
      if(data && data.response && data.response.docs) {
        data.response.docs.forEach(doc => {
          // Deduplicate against existing list
          if(doc.title && doc.identifier) {
            archiveGames.push({
              name: doc.title, 
              ico: '💾', 
              type: 'embed', 
              url: 'https://archive.org/embed/' + doc.identifier
            });
          }
        });
      }
    });
    
    // Merge
    allGames = [...allGames, ...archiveGames];
    status.textContent = `Loaded ${allGames.length} games successfully. GTA is at the top.`;
    render();
    
  } catch(e) { 
    status.textContent = `Loaded ${allGames.length} games (archive fetch failed).`; 
  }
}

// ---------------------------------------------------------
let ftPeer = null;
let ftStream = null;

async function appFaceTime() {
  if (!ftPeer) ftPeer = new Peer();

  const body = `
    <div class="ft-container">
      <div class="ft-setup" id="ft-setup">
        <h2 style="margin:0; font-weight:300;">FaceTime</h2>
        <p style="color:#aaa;">To start a call, allow camera/mic access.</p>
        <button class="app-btn start" id="ft-allow" style="padding:12px 24px; font-size:16px; border-radius:20px;">Allow Camera & Mic</button>
        
        <div id="ft-active" style="display:none; text-align:center; width:100%;">
          <p style="margin-bottom:5px;">Your FaceTime ID:</p>
          <div class="ft-code" id="ft-my-id">Connecting...</div>
          <p style="color:#aaa; font-size:12px;">Share this ID so others can call you.</p>
          
          <hr style="border-color:#333; margin:20px 0; width:80%;">
          
          <p style="margin-bottom:5px;">Or call a friend:</p>
          <div style="display:flex; gap:10px; justify-content:center;">
            <input type="text" id="ft-remote-id" placeholder="Enter their FaceTime ID" style="width:200px;">
            <button class="app-btn start" id="ft-call-btn">Call</button>
          </div>
        </div>
      </div>
      
      <div class="ft-video-area" id="ft-video-area" style="display:none;">
        <video id="ft-remote-video" class="ft-remote-video" autoplay></video>
        <video id="ft-local-video" class="ft-local-video" autoplay muted></video>
        <div id="ft-status" style="position:absolute; top:20px; left:20px; background:rgba(0,0,0,0.6); padding:8px 16px; border-radius:12px; font-weight:600;">Connecting...</div>
      </div>
      
      <div class="ft-controls" id="ft-controls" style="display:none;">
        <button class="ft-btn toggle" id="ft-mute-btn" title="Mute">🎤</button>
        <button class="ft-btn toggle" id="ft-video-btn" title="Turn off camera">📹</button>
        <button class="ft-btn end" id="ft-end" title="End Call">📞</button>
      </div>
    </div>
  `;

  const win = makeWindow('FaceTime', body, { id: 'facetime', w: 800, h: 600 });
  
  const setupDiv = win.querySelector('#ft-setup');
  const videoArea = win.querySelector('#ft-video-area');
  const controls = win.querySelector('#ft-controls');
  const localVideo = win.querySelector('#ft-local-video');
  const remoteVideo = win.querySelector('#ft-remote-video');
  const statusText = win.querySelector('#ft-status');

  let isMuted = false;
  let isVideoOff = false;

  // Request Permissions
  win.querySelector('#ft-allow').onclick = async () => {
    try {
      ftStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      localVideo.srcObject = ftStream;
      
      win.querySelector('#ft-allow').style.display = 'none';
      win.querySelector('#ft-active').style.display = 'block';
      win.querySelector('#ft-my-id').textContent = ftPeer.id || 'Connecting...';
      
      ftPeer.on('open', id => {
        win.querySelector('#ft-my-id').textContent = id;
      });

      // Handle incoming calls
      ftPeer.on('call', call => {
        if(confirm("Incoming FaceTime call! Answer?")) {
          call.answer(ftStream);
          setupDiv.style.display = 'none';
          videoArea.style.display = 'block';
          controls.style.display = 'flex';
          
          call.on('stream', remoteStream => {
            remoteVideo.srcObject = remoteStream;
            statusText.textContent = "In Call";
          });
        } else {
          call.close();
        }
      });

    } catch(err) {
      alert("Camera/Mic access denied or unavailable.\n" + err.message);
    }
  };

  // Make a call
  win.querySelector('#ft-call-btn').onclick = () => {
    const remoteId = win.querySelector('#ft-remote-id').value.trim();
    if(!remoteId) return;
    
    setupDiv.style.display = 'none';
    videoArea.style.display = 'block';
    controls.style.display = 'flex';
    statusText.textContent = "Calling " + remoteId + "...";

    const call = ftPeer.call(remoteId, ftStream);
    call.on('stream', remoteStream => {
      remoteVideo.srcObject = remoteStream;
      statusText.textContent = "In Call with " + remoteId;
    });
    call.on('error', err => {
      statusText.textContent = "Call failed.";
      alert("Call failed. Make sure the ID is correct and the other person is online.");
    });
  };

  // Toggle Controls
  win.querySelector('#ft-mute-btn').onclick = (e) => {
    isMuted = !isMuted;
    ftStream.getAudioTracks()[0].enabled = !isMuted;
    e.target.classList.toggle('off', isMuted);
  };
  win.querySelector('#ft-video-btn').onclick = (e) => {
    isVideoOff = !isVideoOff;
    ftStream.getVideoTracks()[0].enabled = !isVideoOff;
    e.target.classList.toggle('off', isVideoOff);
  };

  // End Call
  win.querySelector('#ft-end').onclick = () => {
    if(ftStream) ftStream.getTracks().forEach(t => t.stop());
    if(ftPeer) ftPeer.destroy();
    ftPeer = null;
    win.remove();
  };
}

// APP: MESSAGES (Chat)
// ---------------------------------------------------------
function appChat() {
  if (!state.user) {
    return makeWindow('Messages', `<div class="app-pad"><h3>No Account</h3><p>Please set a username in Settings first.</p></div>`, {id:'chat', w:400, h:200});
  }

  const body = `
    <div class="mac-chat">
      <div class="side">
        <div style="font-weight:600; margin-bottom:10px; font-size:14px;">@${state.user}</div>
        <input class="app-input" id="c-search" placeholder="Search users...">
        <div id="c-results" style="margin-top:10px;"></div>
      </div>
      <div class="main">
        <div class="mac-msgs" id="c-msgs">
          <div style="margin:auto; color:#888;">Search for a friend to chat.</div>
        </div>
        <div class="mac-composer">
          <input id="c-input" placeholder="iMessage" disabled autocomplete="off">
          <button id="c-send" disabled>↑</button>
        </div>
      </div>
    </div>
  `;

  const win = makeWindow('Messages', body, {id:'chat', w:700, h:500});
  const msgsEl = win.querySelector('#c-msgs');
  const input = win.querySelector('#c-input');
  const sendBtn = win.querySelector('#c-send');
  let partner = null;
  let pollInterval = null;

  const getUsers = () => JSON.parse(localStorage.getItem('obl_users') || '[]');
  const getMsgs = (a,b) => JSON.parse(localStorage.getItem('obl_chat_' + [a,b].sort().join('__')) || '[]');

  function openConvo(name) {
    partner = name;
    input.disabled = false;
    sendBtn.disabled = false;
    input.focus();
    
    if(pollInterval) clearInterval(pollInterval);
    
    // Polling for local storage sync (cross-tab chat)
    pollInterval = setInterval(() => {
      if (!document.body.contains(win)) { clearInterval(pollInterval); return; }
      const m = getMsgs(state.user, partner);
      // Only update if length changed to prevent cursor jump
      if(msgsEl.dataset.count == m.length) return;
      msgsEl.dataset.count = m.length;
      
      msgsEl.innerHTML = '';
      if(m.length === 0) msgsEl.innerHTML = '<div style="margin:auto; color:#888;">No messages yet.</div>';
      m.forEach(msg => {
        const d = document.createElement('div');
        d.className = 'mac-msg ' + (msg.from === state.user ? 'me' : 'them');
        d.textContent = msg.text;
        msgsEl.appendChild(d);
      });
      msgsEl.scrollTop = msgsEl.scrollHeight;
    }, 500);
  }

  win.querySelector('#c-search').oninput = e => {
    const q = e.target.value.toLowerCase();
    const res = win.querySelector('#c-results');
    res.innerHTML = '';
    if(!q) return;
    getUsers().filter(u => u !== state.user && u.toLowerCase().includes(q)).forEach(u => {
      const d = document.createElement('div');
      d.style.padding = '8px'; d.style.cursor = 'pointer'; d.style.borderRadius = '6px'; d.style.fontSize='13px';
      d.textContent = '@' + u;
      d.onmouseover = () => d.style.background = '#e5e5ea';
      d.onmouseout = () => d.style.background = 'transparent';
      d.onclick = () => openConvo(u);
      res.appendChild(d);
    });
  };

  function send() {
    const text = input.value.trim();
    if(!text || !partner) return;
    const key = 'obl_chat_' + [state.user, partner].sort().join('__');
    const m = getMsgs(state.user, partner);
    m.push({ from: state.user, to: partner, text });
    localStorage.setItem(key, JSON.stringify(m));
    input.value = '';
    // force refresh by resetting data count
    msgsEl.dataset.count = 0; 
    openConvo(partner);
  }
  sendBtn.onclick = send;
  input.addEventListener('keydown', e => { if(e.key === 'Enter') send(); });
}

  const win = makeWindow('Terminal', body, {id:'terminal', w:600, h:400});

  const print = s => { out.textContent += s + '\n'; out.scrollTop = out.scrollHeight; };
  print('Last login: ' + new Date().toUTCString() + ' on ttys000');
  
  win.addEventListener('click', () => inp.focus());
  inp.addEventListener('keydown', e => {
    if(e.key === 'Enter') {
      const cmd = inp.value.trim();
      inp.value = '';
      print('user@oblivian ~ % ' + cmd);
      if(cmd === 'help') print('Available commands:\n  help     Show this message\n  neofetch Show system info\n  clear    Clear terminal\n  date     Show current date');
      else if(cmd === 'clear') out.textContent = '';
      else if(cmd === 'date') print(new Date().toString());
      else if(cmd === 'neofetch') {
        print('       .:                  user@oblivian');
        print('     .:::.                ---------------');
        print('   .:::::::.              OS: OblivianOS (macOS Theme)');
        print('  :::::::::::             Host: Web Browser');
        print('  :::::::::::             Kernel: JavaScript V8');
        print('  :::::::::::             Uptime: ' + Math.floor(performance.now()/60000) + ' mins');
        print('   \':::::::\'              Shell: oblsh');
        print('     \':::\'                User: ' + (state.user || 'guest'));
      }
      else if(cmd !== '') print(`zsh: command not found: ${cmd}`);
    }
  });
  setTimeout(() => inp.focus(), 100);
}

];

function buildDock() {
  const dock = $('#dock');
  dock.innerHTML = '';
  
  DOCK_APPS.forEach(app => {
    if(app.divider) {
      const div = document.createElement('div');
      div.className = 'dock-divider';
      dock.appendChild(div);
      return;
    }
    
    const d = document.createElement('div');
    d.className = 'dock-item';
    d.dataset.app = app.id;
    d.innerHTML = `
      <span class="tooltip">${app.name}</span>
      ${app.icon}
      <div class="dot-indicator"></div>
    `;
    
    d.onclick = () => {
      if(app.fn) {
        const existing = openWins[app.id];
        if(existing && document.body.contains(existing)) {
          // Toggle behavior
          if(existing.style.display === 'none') { 
            existing.style.display = 'flex'; 
            existing.style.zIndex = ++zTop; 
          } else { 
            existing.style.display = 'none'; 
          }
          updateDockState();
        } else {
          const win = app.fn();
          if(win) openWins[app.id] = win;
        }
      } else {
        alert(app.name + " is coming soon in a future update!");
      }
    };
    dock.appendChild(d);
  });
}
