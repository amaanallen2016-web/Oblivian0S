<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>macOS - Oblivian</title>
<style>
  :root {
    --system-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; user-select: none; }
  body, html { height: 100%; margin: 0; overflow: hidden; font-family: var(--system-font); }
  
  /* The Forest Wallpaper */
  #wallpaper {
    position: fixed; inset: 0; z-index: -1;
    background: url('https://images.unsplash.com/photo-1448375240586-882707db888b?q=80&w=2070&auto=format&fit=crop') center/cover no-repeat;
  }

  /* Top Menu Bar */
  #menubar {
    position: fixed; top: 0; left: 0; right: 0; height: 28px; z-index: 9999;
    background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    display: flex; align-items: center; justify-content: space-between; padding: 0 16px;
    color: #000; font-size: 13px; font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,0.05);
  }
  .menu-left, .menu-right { display: flex; gap: 20px; align-items: center; }
  .menu-item { cursor: pointer; opacity: 0.9; }
  .menu-item:hover { opacity: 1; }
  .apple-logo { font-size: 16px; margin-right: 5px; }
  .menu-right svg { width: 16px; height: 16px; fill: currentColor; cursor: pointer; }

  /* Left Widgets */
  #widgets {
    position: absolute; top: 50px; left: 20px; z-index: 10;
    display: flex; flex-direction: column; gap: 16px;
  }
  .widget {
    background: rgba(255, 255, 255, 0.25); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
    border-radius: 20px; border: 1px solid rgba(255,255,255,0.3); padding: 16px;
    color: #fff; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  }
  .w-weather { width: 160px; background: linear-gradient(180deg, #3b82f6, #2563eb); border: none; }
  .w-weather h2 { margin: 0; font-size: 34px; font-weight: 400; }
  .w-weather p { margin: 4px 0; font-size: 14px; font-weight: 500; }
  .w-weather .desc { font-size: 12px; opacity: 0.9; }
  .w-battery { width: 160px; text-align: center; }
  .w-battery .ring { width: 60px; height: 60px; border-radius: 50%; border: 6px solid rgba(255,255,255,0.3); border-top-color: #ef4444; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
  .w-calendar { width: 160px; height: 160px; }
  .w-calendar .header { color: #ef4444; font-size: 12px; font-weight: 700; text-transform: uppercase; }
  .w-calendar .date { font-size: 40px; font-weight: 300; line-height: 1; margin-top: 5px; color: #000; }
  .w-calendar .event { font-size: 11px; color: #000; margin-top: 10px; }

  /* Center Clock */
  #clock {
    position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
    font-size: 120px; font-weight: 500; color: #fff; letter-spacing: -4px;
    text-shadow: 0 4px 20px rgba(0,0,0,0.3); z-index: 5;
  }

  /* Desktop Icons */
  #desktop-icons {
    position: absolute; top: 50px; right: 20px; z-index: 10;
    display: flex; flex-direction: column; gap: 20px; align-items: center;
  }
  .d-icon { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; }
  .d-icon .img { width: 56px; height: 56px; background: rgba(255,255,255,0.8); border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); display: flex; align-items: center; justify-content: center; font-size: 30px; }
  .d-icon span { color: #fff; font-size: 12px; text-shadow: 0 1px 3px rgba(0,0,0,0.8); text-align: center; }

  /* Bottom Dock */
  #dock-container {
    position: fixed; bottom: 8px; left: 50%; transform: translateX(-50%); z-index: 9999;
  }
  #dock {
    display: flex; gap: 6px; padding: 8px 12px; border-radius: 22px;
    background: rgba(255, 255, 255, 0.25); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
    border: 1px solid rgba(255,255,255,0.3); box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    align-items: flex-end;
  }
  .dock-item {
    width: 52px; height: 52px; border-radius: 14px; display: flex; align-items: center; justify-content: center;
    font-size: 32px; cursor: pointer; transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
    position: relative;
  }
  .dock-item:hover { transform: scale(1.3) translateY(-10px); margin: 0 6px; }
  .dock-item:hover .tooltip { opacity: 1; }
  .tooltip {
    position: absolute; top: -30px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.6); color: #fff; font-size: 11px; padding: 4px 8px; border-radius: 6px;
    opacity: 0; pointer-events: none; transition: opacity 0.2s; white-space: nowrap;
  }
  .dock-divider { width: 1px; height: 48px; background: rgba(255,255,255,0.3); margin: 0 6px; align-self: center; }

  /* Windows */
  #desk-windows { position: fixed; inset: 0; z-index: 1000; pointer-events: none; }
  .win {
    position: absolute; pointer-events: auto; display: flex; flex-direction: column; min-width: 400px; min-height: 300px;
    background: #ffffff; border-radius: 12px; overflow: hidden;
    box-shadow: 0 20px 50px rgba(0,0,0,0.4), 0 0 0 1px rgba(0,0,0,0.1);
    animation: pop 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  @keyframes pop { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
  
  .win-header {
    height: 38px; background: #f6f6f6; border-bottom: 1px solid #e5e5e5;
    display: flex; align-items: center; padding: 0 12px; cursor: grab;
  }
  .win-header:active { cursor: grabbing; }
  .traffic-lights { display: flex; gap: 8px; }
  .tl { width: 12px; height: 12px; border-radius: 50%; border: 0.5px solid rgba(0,0,0,0.1); cursor: pointer; }
  .tl.close { background: #ff5f56; }
  .tl.min { background: #ffbd2e; }
  .tl.max { background: #27c93f; }
  .tl.close:hover, .tl.min:hover, .tl.max:hover { filter: brightness(0.8); }
  .win-title { flex: 1; text-align: center; font-size: 13px; font-weight: 600; color: #333; margin-right: 50px; }
  
  .win-body { flex: 1; overflow: auto; background: #fff; color: #333; font-size: 13px; }

  /* App UI inside windows */
  .app-pad { padding: 20px; }
  .app-btn { background: #007aff; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .app-btn:hover { background: #0066cc; }
  .app-btn.sec { background: #e5e5ea; color: #000; }
  .app-input { width: 100%; padding: 8px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; margin-bottom: 10px; outline: none; }
  .app-input:focus { border-color: #007aff; }
  
  /* Games Grid */
  .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 15px; padding: 20px; }
  .game-tile { display: flex; flex-direction: column; align-items: center; text-align: center; cursor: pointer; padding: 10px; border-radius: 8px; transition: background 0.2s; }
  .game-tile:hover { background: #f0f0f5; }
  .game-tile .ico { font-size: 40px; margin-bottom: 8px; }
  .game-tile .nm { font-size: 12px; font-weight: 500; color: #333; line-height: 1.2; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

  /* Chat UI */
  .mac-chat { display: flex; height: 100%; }
  .mac-chat .side { width: 200px; background: #f6f6f6; border-right: 1px solid #e5e5e5; padding: 10px; overflow-y: auto; }
  .mac-chat .main { flex: 1; display: flex; flex-direction: column; }
  .mac-msgs { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; background: #fff; }
  .mac-msg { max-width: 70%; padding: 8px 12px; border-radius: 16px; font-size: 13px; }
  .mac-msg.me { align-self: flex-end; background: #007aff; color: #fff; border-bottom-right-radius: 4px; }
  .mac-msg.them { align-self: flex-start; background: #e5e5ea; color: #000; border-bottom-left-radius: 4px; }
  .mac-composer { padding: 10px; border-top: 1px solid #e5e5e5; display: flex; gap: 8px; background: #f6f6f6; }
  .mac-composer input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 16px; outline: none; }
  .mac-composer button { background: #007aff; color: #fff; border: none; border-radius: 50%; width: 32px; height: 32px; cursor: pointer; font-size: 16px; }

  /* Boot Screen (Fades away instantly on load) */
  #boot { position: fixed; inset: 0; z-index: 10000; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.5s; }
  #boot.fade { opacity: 0; pointer-events: none; }
  #boot .apple-logo { font-size: 80px; color: #fff; margin-bottom: 20px; animation: pulse 2s infinite; }
  #boot .bar { width: 200px; height: 4px; background: #333; border-radius: 2px; overflow: hidden; }
  #boot .bar div { width: 0%; height: 100%; background: #fff; animation: load 1.5s forwards; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  @keyframes load { to { width: 100%; } }
</style>
</head>
<body>

<div id="boot">
  <div class="apple-logo"></div>
  <div class="bar"><div></div></div>
</div>

<div id="wallpaper"></div>

<!-- Top Menu Bar -->
<div id="menubar">
  <div class="menu-left">
    <span class="apple-logo"></span>
    <span class="menu-item" style="font-weight:700">Finder</span>
    <span class="menu-item">File</span>
    <span class="menu-item">Edit</span>
    <span class="menu-item">View</span>
    <span class="menu-item">Go</span>
    <span class="menu-item">Window</span>
    <span class="menu-item">Help</span>
  </div>
  <div class="menu-right">
    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
    <svg viewBox="0 0 24 24"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4zM11 20H9v-2h2v2zm0-4H9v-2h2v2zm0-4H9V9h2v3zm4 8h-2v-2h2v2zm0-4h-2v-2h2v2zm0-4h-2V9h2v3z"/></svg>
    <svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2zm-2 1H8v-6c0-2.48 1.51-4.5 4-4.5s4 2.02 4 4.5v6z"/></svg>
    <span class="menu-item" id="menu-clock">Sun Oct 18 12:21 PM</span>

<!-- Widgets -->

<!-- Big Clock -->

<!-- Desktop Icons -->
<div id="desktop-icons">
  <div class="d-icon">
    <div class="img" style="background:#e5e5ea">💻</div>

  <div class="d-icon">

<script>
/* =========================================================
   LOGIC & APPS
   ========================================================= */

const state = {
  os: 'mac',
  user: JSON.parse(localStorage.getItem('obl_user')) || null
};
const $ = s => document.querySelector(s);

// Clock updater
function updateTime() {
  const now = new Date();
  const str = now.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' }) + ' ' + 
              now.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
  $('#menu-clock').textContent = str;
  const timeOnly = now.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
  $('#clock').textContent = timeOnly;
}
setInterval(updateTime, 1000);
updateTime();

// Window Manager
let zTop = 1000;
const openWins = {};

function updateDockState() {
  document.querySelectorAll('.dock-item').forEach(el => {
    const id = el.dataset.app;
    el.style.opacity = (openWins[id] && document.body.contains(openWins[id]) && openWins[id].style.display !== 'none') ? '1' : '0.8';
  });
}

function makeWindow(title, html, opts = {}) {
  const win = document.createElement('div');
  win.className = 'win';
  win.style.width = (opts.w || 760) + 'px';
  win.style.height = (opts.h || 520) + 'px';
  
  const n = document.querySelectorAll('#desk-windows .win').length;
  win.style.left = Math.max(10, Math.min(100 + n*20, window.innerWidth - 400)) + 'px';
  win.style.top = Math.max(40, Math.min(80 + n*20, window.innerHeight - 300)) + 'px';
  win.style.zIndex = ++zTop;

  win.innerHTML = `
    <div class="win-header">
      <div class="traffic-lights">
        <div class="tl close"></div>
        <div class="tl min"></div>
        <div class="tl max"></div>
      </div>
      <div class="win-title">${title}</div>
    </div>
    <div class="win-body">${html}</div>
  `;

  document.getElementById('desk-windows').appendChild(win);

  // Dragging
  const head = win.querySelector('.win-header');
  let dragging = false, sx = 0, sy = 0, ox = 0, oy = 0;
  head.addEventListener('pointerdown', e => {
    if (e.target.closest('.tl')) return;
    dragging = true; sx = e.clientX; sy = e.clientY;
    ox = parseFloat(win.style.left); oy = parseFloat(win.style.top);
    head.setPointerCapture(e.pointerId);
  });
  head.addEventListener('pointermove', e => {
    if (!dragging) return;
    win.style.left = Math.max(-40, Math.min(window.innerWidth - 100, ox + e.clientX - sx)) + 'px';
    win.style.top = Math.max(28, Math.min(window.innerHeight - 60, oy + e.clientY - sy)) + 'px';
  });
  head.addEventListener('pointerup', () => { dragging = false; });

  win.addEventListener('pointerdown', () => { win.style.zIndex = ++zTop; });

  // Buttons
  win.querySelector('.close').onclick = () => { win.remove(); delete openWins[opts.id]; updateDockState(); };
  win.querySelector('.min').onclick = () => { win.style.display = 'none'; updateDockState(); };
  win.querySelector('.max').onclick = () => {
    if (win.style.width === '100vw') {
      win.style.width = (opts.w || 760) + 'px'; win.style.height = (opts.h || 520) + 'px';
      win.style.left = '100px'; win.style.top = '100px';
    } else {
      win.style.width = '100vw'; win.style.height = 'calc(100vh - 28px)';
      win.style.left = '0'; win.style.top = '28px';
    }
  };

  updateDockState();
  return win;
}

/* =========================================================
   APPS
   ========================================================= */

// 1. Games App
async function appGames() {
  const body = `
    <div style="padding:15px 20px 0;">
      <div style="display:flex; gap:10px; margin-bottom:15px;">
        <input id="g-search" class="app-input" style="flex:1;" placeholder="Search 6000+ games...">
        <button class="app-btn" id="g-add">+ Custom URL</button>
      </div>
      <div style="font-size:12px; color:#666; margin-bottom:10px;" id="g-status">Loading archive...</div>
    </div>
    <div class="game-grid" id="g-grid"></div>
    <div style="text-align:center; padding-bottom:20px;" id="g-more"></div>
  `;
  
  const win = makeWindow('Games', body, { id: 'games', w: 900, h: 600 });
  const grid = win.querySelector('#g-grid');
  const status = win.querySelector('#g-status');
  const moreEl = win.querySelector('#g-more');
  
  let all = [];
  let shown = 100;

  function render(filter = '') {
    const q = filter.toLowerCase();
    const matches = q ? all.filter(g => (g.name||'').toLowerCase().includes(q)) : all;
    const slice = q ? matches.slice(0, 300) : matches.slice(0, shown);
    
    grid.innerHTML = '';
    slice.forEach(g => {
      const d = document.createElement('div');
      d.className = 'game-tile';
      d.innerHTML = `<div class="ico">${g.ico || '🎮'}</div><div class="nm">${g.name}</div>`;
      d.onclick = () => launchGame(g);
      grid.appendChild(d);
    });
    if (matches.length === 0) grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:#666;">No games found.</div>';
    
    moreEl.innerHTML = '';
    if (!q && matches.length > shown) {
      const btn = document.createElement('button');
      btn.className = 'app-btn sec';
      btn.textContent = `Load More (${matches.length - shown} left)`;
      btn.onclick = () => { shown += 200; render(); };
      moreEl.appendChild(btn);
    }
  }

  win.querySelector('#g-search').oninput = e => render(e.target.value);
  
  // Load Local
  try {
    const r = await fetch('data/games.json');
    if(r.ok) all = await r.json();
  } catch(e) { all = [{name:'Snake', ico:'🐍', type:'inline', fn:'snake'}]; }
  
  render();
  status.textContent = "Fetching archive.org...";
  
  // Load Archive
  try {
    const colls = ['softwarelibrary_msdos_games', 'internetarcade', 'softwarelibrary_apple_II', 'softwarelibrary_atari_2600'];
    const reqs = colls.map(c => fetch(`https://archive.org/advancedsearch.php?q=collection%3A${c}&fl%5B%5D=identifier&fl%5B%5D=title&rows=500&output=json`).then(r=>r.json()));
    const res = await Promise.all(reqs);
    let arch = [];
    res.forEach(r => {
      if(r.response && r.response.docs) {
        r.response.docs.forEach(d => arch.push({
          name: d.title, ico: '💾', type: 'embed', url: 'https://archive.org/embed/' + d.identifier
        }));
      }
    });
    all = [...all, ...arch];
    status.textContent = `Loaded ${all.length} games.`;
    render();
  } catch(e) { status.textContent = "Archive failed to load."; }
}

// 2. Messages App
function appChat() {
  if (!state.user) {
    const win = makeWindow('Messages', `<div class="app-pad"><p>Please set a username in Settings first.</p></div>`, {id:'chat', w:400, h:200});
    return;
  }

  const body = `
    <div class="mac-chat">
      <div class="side">
        <div style="font-weight:600; margin-bottom:10px; font-size:14px;">@${state.user}</div>
        <input class="app-input" id="c-search" placeholder="Search users...">
        <div id="c-results" style="margin-top:10px;"></div>
      </div>
      <div class="main">
        <div class="mac-msgs" id="c-msgs">
          <div style="margin:auto; color:#888;">Search for a friend to chat.</div>
        </div>
        <div class="mac-composer">
          <input id="c-input" placeholder="iMessage" disabled>
          <button id="c-send" disabled>↑</button>
        </div>
      </div>
    </div>
  `;

  const win = makeWindow('Messages', body, {id:'chat', w:700, h:500});
  const msgsEl = win.querySelector('#c-msgs');
  const input = win.querySelector('#c-input');
  const sendBtn = win.querySelector('#c-send');
  let partner = null;

  const getUsers = () => JSON.parse(localStorage.getItem('obl_users') || '[]');
  const getMsgs = (a,b) => JSON.parse(localStorage.getItem('obl_chat_' + [a,b].sort().join('__')) || '[]');

  function openConvo(name) {
    partner = name;
    input.disabled = false;
    sendBtn.disabled = false;
    input.focus();
    
    // Simple polling for local storage sync
    setInterval(() => {
      if (!document.body.contains(win)) return;
      const m = getMsgs(state.user, partner);
      msgsEl.innerHTML = '';
      if(m.length === 0) msgsEl.innerHTML = '<div style="margin:auto; color:#888;">No messages yet.</div>';
      m.forEach(msg => {
        const d = document.createElement('div');
        d.className = 'mac-msg ' + (msg.from === state.user ? 'me' : 'them');
        d.textContent = msg.text;
        msgsEl.appendChild(d);
      });
      msgsEl.scrollTop = msgsEl.scrollHeight;
    }, 1000);
  }

  win.querySelector('#c-search').oninput = e => {
    const q = e.target.value.toLowerCase();
    const res = win.querySelector('#c-results');
    res.innerHTML = '';
    if(!q) return;
    getUsers().filter(u => u !== state.user && u.toLowerCase().includes(q)).forEach(u => {
      const d = document.createElement('div');
      d.style.padding = '8px'; d.style.cursor = 'pointer'; d.style.borderRadius = '6px';
      d.textContent = '@' + u;
      d.onmouseover = () => d.style.background = '#e5e5ea';
      d.onmouseout = () => d.style.background = 'transparent';
      d.onclick = () => openConvo(u);
      res.appendChild(d);
    });
  };

  function send() {
    const text = input.value.trim();
    if(!text || !partner) return;
    const key = 'obl_chat_' + [state.user, partner].sort().join('__');
    const m = getMsgs(state.user, partner);
    m.push({ from: state.user, to: partner, text });
    localStorage.setItem(key, JSON.stringify(m));
    input.value = '';
    // force refresh
    win.querySelector('#c-search').dispatchEvent(new Event('input'));
  }
  sendBtn.onclick = send;
  input.addEventListener('keydown', e => { if(e.key === 'Enter') send(); });
}

// 3. Settings
function appSettings() {
  const body = `
    <div class="app-pad">
      <h3>Account</h3>
      <input class="app-input" id="s-user" placeholder="Username" value="${state.user || ''}">
      <button class="app-btn" id="s-save">Save</button>
      
      <h3 style="margin-top:30px;">Wallpaper</h3>
      <div style="display:flex; gap:10px;">
        <div style="width:60px; height:60px; border-radius:8px; background:url('https://images.unsplash.com/photo-1448375240586-882707db888b?q=80&w=2070&auto=format&fit=crop') center/cover; border:2px solid #007aff;"></div>
        <div style="width:60px; height:60px; border-radius:8px; background:#1a1a1a; border:1px solid #ccc;"></div>
      </div>
    </div>
  `;
  const win = makeWindow('System Settings', body, {id:'settings', w:500, h:400});
  
  win.querySelector('#s-save').onclick = () => {
    const u = win.querySelector('#s-user').value.trim();
    if(u) {
      state.user = u;
      localStorage.setItem('obl_user', JSON.stringify(u));
      const users = JSON.parse(localStorage.getItem('obl_users') || '[]');
      if(!users.includes(u)) { users.push(u); localStorage.setItem('obl_users', JSON.stringify(users)); }
      alert('Username saved!');
    }
  };
}

// 4. Terminal
function appTerminal() {
  const body = `
    <div style="background:#000; color:#fff; font-family:monospace; height:100%; padding:10px; display:flex; flex-direction:column;">
      <div id="t-out" style="flex:1; overflow:auto; white-space:pre-wrap; font-size:12px;"></div>
      <div style="display:flex; gap:8px; margin-top:8px;">
        <span>$</span><input id="t-in" style="flex:1; background:transparent; border:none; color:#fff; outline:none; font-family:monospace;" autocomplete="off">
      </div>
    </div>
  `;
  const win = makeWindow('Terminal', body, {id:'terminal', w:600, h:400});
  const out = win.querySelector('#t-out'), inp = win.querySelector('#t-in');
  const print = s => { out.textContent += s + '\n'; out.scrollTop = out.scrollHeight; };
  print('Welcome to OblivianOS Terminal');
  inp.focus();
  inp.addEventListener('keydown', e => {
    if(e.key === 'Enter') {
      const cmd = inp.value.trim();
      inp.value = '';
      print('$ ' + cmd);
      if(cmd === 'help') print('help, neofetch, clear, date');
      else if(cmd === 'clear') out.textContent = '';
      else if(cmd === 'date') print(new Date().toString());
      else if(cmd === 'neofetch') print('OS: OblivianOS (macOS Theme)\nUser: ' + (state.user||'guest'));
      else if(cmd !== '') print('command not found');
    }
  });
  win.addEventListener('click', () => inp.focus());
}

// 5. Browser
function appBrowser() {
  const body = `
    <div style="display:flex; flex-direction:column; height:100%;">
      <div style="padding:8px; background:#f6f6f6; border-bottom:1px solid #e5e5e5; display:flex; gap:8px;">
        <input id="url" class="app-input" style="margin:0; flex:1;" placeholder="Search or enter website name">
        <button class="app-btn" id="go">Go</button>
      </div>
      <iframe id="frame" style="flex:1; border:none; width:100%;"></iframe>
    </div>
  `;
  const win = makeWindow('Safari', body, {id:'browser', w:900, h:600});
  const url = win.querySelector('#url'), frame = win.querySelector('#frame');
  win.querySelector('#go').onclick = () => {
    let u = url.value.trim();
    if(!u) return;
    if(!/^https?:\/\//i.test(u)) u = 'https://' + u;
    frame.src = u;
  };
}

// Launch Game
function launchGame(g) {
  if(g.type === 'inline' && g.fn === 'snake') {
    // Just use a placeholder for snake for now or an iframe
    return makeWindow('Snake', '<iframe src="https://hextris.io/" style="width:100%;height:100%;border:none;"></iframe>', {w:500, h:500});
  }
  const body = `
    <div style="display:flex; flex-direction:column; height:100%;">
      <div style="padding:8px; background:#f6f6f6; border-bottom:1px solid #e5e5e5; display:flex; justify-content:space-between; align-items:center;">
        <span style="font-size:12px; color:#666; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${g.url}</span>
        <button class="app-btn sec" onclick="window.open('${g.url}', '_blank')">Open Externally</button>
      </div>
      <iframe src="${g.url}" style="flex:1; border:none; width:100%;"></iframe>
    </div>
  `;
  makeWindow(g.name, body, { w:900, h:600 });
}

  { id: 'calendar', icon: '📅', name: 'Calendar' },

  { id: 'terminal', icon: '>_', name: 'Terminal', fn: appTerminal },
  { id: 'divider', divider: true },
  { id: 'trash', icon: '🗑️', name: 'Trash' }
];

function buildDock() {
  const dock = $('#dock');
  dock.innerHTML = '';
  DOCK_APPS.forEach(app => {
    if(app.divider) {
      const div = document.createElement('div');
      div.className = 'dock-divider';
      dock.appendChild(div);
      return;
    }
    const d = document.createElement('div');
    d.className = 'dock-item';
    d.dataset.app = app.id;
    d.innerHTML = `<span class="tooltip">${app.name}</span>${app.icon}`;
    d.onclick = () => {
      if(app.fn) {
        const existing = openWins[app.id];
        if(existing && document.body.contains(existing)) {
          if(existing.style.display === 'none') { existing.style.display = 'flex'; existing.style.zIndex = ++zTop; }
          else { existing.remove(); delete openWins[app.id]; }
          updateDockState();
        } else {
          const win = app.fn();
          if(win) openWins[app.id] = win;
        }
      }
    };
    dock.appendChild(d);
  });
}

// Initialize
buildDock();
setTimeout(() => {
  $('#boot').classList.add('fade');
  setTimeout(() => $('#boot').remove(), 600);
}, 1500);
